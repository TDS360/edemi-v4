}

/* ---------- shared results screen ----------
   A game finishes by calling finishGame(). It saves the best score, hands out rewards and switches the view to its "over" phase. */
function finishGame(g,o){
  const lb=g.lb,prev=P.best[lb]||0,isBest=o.score>prev;
  if(isBest)P.best[lb]=o.score;
  P.plays[lb]=(P.plays[lb]||0)+1;
  if(o.pieces)P.tower+=o.pieces;if(o.coins)P.coins+=o.coins;
  addXP(o.xp||0);
  S.g=Object.assign({phase:'over',game:g.id},o,{isBest,rank:board(lb).rank,total:board(lb).all.length});
  sfx(isBest?'win':'ok');render();
}
function gameOver(){
  const r=S.g,g=GAMES.find(x=>x.id===r.game);
  return `<div class="panel cen"><div class="eyebrow muted">${esc(g.t)}</div>
    <div class="big" style="font-family:var(--f-ui);font-weight:800;margin:8px 0">${r.score.toLocaleString()}</div>
    ${r.isBest?'<div class="chip on" style="display:inline-block">New personal best</div>':`<div class="meta">Personal best ${(P.best[g.lb]||0).toLocaleString()}</div>`}
    <p class="muted" style="margin:12px 0 0">${(r.lines||[]).map(esc).join('<br>')}</p>
    <div class="stats" style="justify-content:center;margin-top:16px"><span><b>#${r.rank}</b>of ${r.total}</span><span><b>+${r.xp||0}</b>XP</span>${r.pieces?`<span><b>+${r.pieces}</b>tower</span>`:''}${r.coins?`<span><b>+${r.coins}</b>cowries</span>`:''}</div>
    ${r.pieces?`<div style="margin-top:8px">${towerSvg(P.tower-r.pieces,r.pieces,130)}</div>`:''}
    <div class="row"><button class="btn" data-act="gplay" data-id="${g.id}">Play again</button><button class="btn alt" data-act="lbgo" data-id="${g.lb}">Leaderboard</button><button class="btn alt" data-act="tab" data-v="games">Game Hub</button></div>
    <p class="fine">Rank is against simulated players.</p></div>`;
}
const overPhase=id=>S.g&&S.g.game===id&&S.g.phase==='over';

/* ---------- add a new game with ONE call ----------
   registerGame({id,title,yo,desc,icon,range,view,start})
     id     short lowercase letters, used as the page address (#id) and leaderboard key
     icon   inner SVG markup for a 64x64 icon (optional)   range  [low,high] typical score, for the simulated rivals
     view   function returning the game's HTML              start  function that begins a round (sets S.g, calls render())
   See templates/game-template.js for a complete example. */
function registerGame(g){
  GAMES.push({id:g.id,t:g.title,yo:g.yo||'',d:g.desc,lb:g.id});
  LB.splice(LB.length-1,0,[g.id,g.title]);          // before "Tower height"
  LB_RANGE[g.id]=g.range||[100,1000];
  GI[g.id]=g.icon||GI.match;
  VIEWS[g.id]=g.view;ACT['start'+g.id]=g.start;REG.push(g.id);
}
ACT.lbtab=d=>{S.lb=d.id;render()};
ACT.lbgo=d=>{S.lb=d.id;go('leaders')};
ACT.gplay=d=>{S.g=null;(ACT['start'+d.id]||(()=>{}))();};
VIEWS.games=games;VIEWS.leaders=leaders;

/* ===== 10-game-match-tower.js  Game 1: Match Game.  Game 2: Tone Tower (the pronunciation-style game). ===== */

/* ---------- shared intro card ---------- */
const intro=(g,text,btn)=>`<div class="panel cen"><div class="gic" style="display:inline-block">${gicon(g.id,84)}</div><h2 style="margin-top:8px">${esc(g.t)}</h2><div class="yoname">${esc(g.yo)}</div>
  <p style="margin:12px auto 0;max-width:46ch">${text}</p><div class="row"><button class="btn" data-act="start${g.id}">${btn||'Start'}</button></div>
  ${P.best[g.lb]?`<p class="meta" style="margin:12px 0 0">Your best: ${P.best[g.lb].toLocaleString()}</p>`:''}</div>`;

/* ================= MATCH GAME ================= */
let matchTimer=0,matchLock=0;
function matchStop(){clearInterval(matchTimer);clearTimeout(matchLock);matchTimer=0}
STOPS.push(matchStop);
ACT.startmatch=()=>{
  matchStop();
  const pool=uniqBy(poolFor(i=>!unit(i.unit).build&&i.yo.split(' ').length<=2&&i.yo.length<=16&&i.en.length<=26,6),i=>i.en);
  const pick=uniqBy(shuf(pool),i=>i.yo).slice(0,6);
  /* ids are assigned after shuffling so a card's id is its position */
  const cards=shuf(pick.flatMap((it,k)=>[{k,t:it.yo,side:'yo'},{k,t:it.en,side:'en'}])).map((c,i)=>Object.assign(c,{id:i}));
  S.g={phase:'play',game:'match',cards,open:[],done:new Set(),moves:0,t0:Date.now(),secs:0};
  matchTimer=setInterval(()=>{if(S.g&&S.g.game==='match'&&S.g.phase==='play'){S.g.secs=Math.floor((Date.now()-S.g.t0)/1000);const e=$('#mtime');if(e)e.textContent=S.g.secs+'s'}},500);
  render();
};
ACT.mflip=d=>{
  const g=S.g;if(!g||g.phase!=='play'||g.open.length>=2)return;
  const id=+d.id;if(g.open.includes(id)||g.done.has(id))return;
  g.open.push(id);sfx('flip');
  if(g.open.length===2){
    g.moves++;const[a,b]=g.open.map(i=>g.cards[i]);
    if(a.k===b.k&&a.side!==b.side){
      g.done.add(a.id);g.done.add(b.id);g.open=[];sfx('ok');
      if(g.done.size===g.cards.length){matchStop();matchFinish();return}
    }else{sfx('bad');matchLock=setTimeout(()=>{if(S.g===g){g.open=[];render()}},750)}
  }
  render();
};
function matchFinish(){
  const g=S.g,secs=Math.floor((Date.now()-g.t0)/1000),pairs=g.cards.length/2;
  const score=Math.max(100,1000-(g.moves-pairs)*40-secs*5);
  finishGame(GAMES[0],{score,xp:10+pairs,lines:[`${pairs} pairs in ${g.moves} moves, ${secs} seconds.`,`Fewer moves and less time score higher.`]});
}
function matchView(){
  if(overPhase('match'))return gameOver();
  const g=S.g;
  if(!g||g.game!=='match')return intro(GAMES[0],'Flip two cards at a time. Match each Yorùbá word with its English meaning. Fewer moves and a faster time score more.','Deal the cards');
  return `<div class="gbar"><span><b>${g.done.size/2}</b>/${g.cards.length/2} pairs</span><span><b>${g.moves}</b> moves</span><span><b id="mtime">${g.secs}s</b></span></div>
  <div class="mgrid">${g.cards.map(c=>{const up=g.open.includes(c.id)||g.done.has(c.id);
    return `<button class="mcard${up?' up':''}${g.done.has(c.id)?' ok':''}${c.side==='yo'?' yo':''}" data-act="mflip" data-id="${c.id}" ${up?'disabled':''} aria-label="${up?esc(c.t):'Hidden card'}">${up?esc(c.t):'<span class="mback" aria-hidden="true"></span>'}</button>`}).join('')}</div>`;
}
VIEWS.match=matchView;

/* ================= TONE TOWER =================
   Browsers cannot listen to Yorùbá speech, so instead of speaking, you train the same skill by ear:
   hear the pitch pattern of a word, then pick the word whose tone marks match. */
function towerPool(){
  return poolFor(i=>{if(/[\s-]/.test(i.yo)||unit(i.unit).build)return false;const n=toneOf(i.yo).length;return n>=2&&n<=4},12);
}
function towerQ(it,pool){
  const p=toneOf(it.yo);
  let d=shuf(pool.filter(x=>x.yo!==it.yo&&toneOf(x.yo)!==p&&toneOf(x.yo).length===p.length));
  if(d.length<3)d=d.concat(shuf(pool.filter(x=>x.yo!==it.yo&&toneOf(x.yo)!==p&&!d.includes(x))));
  d=uniqBy(d,x=>toneOf(x.yo)).slice(0,3);
  return{it,p,opts:shuf([it,...d])};
}
ACT.starttower=()=>{
  const pool=towerPool();
  if(pool.length<5){toast('Finish a lesson or two first so there are words to play with.');return}
  const qs=shuf(pool).slice(0,10).map(it=>towerQ(it,pool));
  S.g={phase:'play',game:'tower',qs,qi:0,score:0,combo:0,right:0,pick:null};
  render();playSeq([...qs[0].p]);
};
ACT.tpick=d=>{
  const g=S.g;if(!g||g.pick!==null)return;
  const q=g.qs[g.qi];g.pick=d.v;const ok=d.v===q.it.yo;
  if(ok){g.right++;g.combo++;g.score+=100+25*Math.min(g.combo-1,4)}else g.combo=0;
  sfx(ok?'ok':'bad');render();
};
ACT.tplay=()=>{const g=S.g;if(g)playSeq([...g.qs[g.qi].p])};
ACT.tnext=()=>{
  const g=S.g;g.qi++;g.pick=null;
  if(g.qi>=g.qs.length){
    P.audioDone++;
    finishGame(GAMES[1],{score:g.score,xp:6+g.right*3,pieces:g.right,lines:[`${g.right} of ${g.qs.length} right.`,g.right?`${g.right} piece${g.right===1?'':'s'} added to your tower.`:'No pieces this time. Listen for high, mid and low.']});
  }else{render();playSeq([...g.qs[g.qi].p])}
};
function towerView(){
  if(overPhase('tower'))return gameOver();
  const g=S.g;
  if(!g||g.game!=='tower')return intro(GAMES[1],'Press play and listen to the pitch pattern. Pick the word whose tone marks match what you heard: grave is low, no mark is mid, acute is high. Every right answer adds a piece to your tower. Voice input is not possible in this app, so this trains your ear instead.','Build my tower');
  const q=g.qs[g.qi],ans=g.pick!==null;
  return `<div class="gbar"><span>Word <b>${g.qi+1}</b>/${g.qs.length}</span><span>Combo <b>${g.combo}</b></span><span>Score <b>${g.score}</b></span></div>
  <div class="panel towerplay"><div class="tw">${towerSvg(P.tower,g.right,150)}</div>
  <div><div class="q-label" style="margin-top:0">Which word has this pitch?</div>
    <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" data-act="tplay">▶ Play pitch</button></div>
    <div class="meta" style="margin-top:8px">${q.p.length} syllables</div></div></div>
  <div class="opts">${q.opts.map(o=>{let cl='opt yo';if(ans){if(o.yo===q.it.yo)cl+=' right';else if(o.yo===g.pick)cl+=' wrong'}
    return `<button class="${cl}" data-act="tpick" data-v="${esc(o.yo)}" ${ans?'disabled':''}>${esc(o.yo)} <span class="meta" style="font-family:var(--f-body);font-weight:400">· ${esc(o.en)}</span></button>`}).join('')}</div>
  ${ans?`<div class="fb ${g.pick===q.it.yo?'ok':'no'}"><b>${g.pick===q.it.yo?'Right. +1 tower piece':'Not quite'}</b><span><span class="yo">${esc(q.it.yo)}</span> (${esc(q.it.en)}) is <b style="display:inline">${toneNames(q.p)}</b>.</span><div style="max-width:150px;margin-top:6px">${contour(q.p)}</div></span></div>
  <div class="row"><button class="btn" data-act="tnext">${g.qi+1>=g.qs.length?'Finish':'Next word'}</button></div>`:''}`;
}
VIEWS.tower=towerView;

/* ===== 11-game-runner.js  Game 3: Cowrie Run, a three-lane endless runner on a canvas.
   Controls: arrow keys or A/D (lanes), Up/W/Space (jump), Down/S (slide), swipe on touch, or the on-screen buttons.
   The loop draws everything itself, so the page is not re-rendered while you play. ===== */

const RUN={raf:0,last:0,st:null,cv:null,cx:null,col:{}};
const RW=360,RH=540,HOR=130,PL_P=.88,COWRIES_PER_PIECE=15;
const laneX=(lane,p)=>RW/2+(lane-1)*(26+104*p);
const groundY=p=>HOR+(RH-30-HOR)*p;
const scaleOf=p=>.12+.88*p;

function runStop(){cancelAnimationFrame(RUN.raf);RUN.raf=0;RUN.st=null}
STOPS.push(runStop);
ACT.startrunner=()=>{
  runStop();
  S.g={phase:'play',game:'runner'};
  RUN.st={lane:1,lx:1,h:0,vy:0,slide:0,spd:1,dist:0,coins:0,obs:[],spawn:.6,off:0,t:0,dead:false,hitT:0};
  render();
};
function runnerStart(){ /* called after the canvas exists */
  RUN.cv=$('#rcv');if(!RUN.cv||!RUN.st)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);RUN.cv.width=RW*dpr;RUN.cv.height=RH*dpr;RUN.cx=RUN.cv.getContext('2d');RUN.cx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim()||'#888';
  RUN.col={hero:v('--hero'),bg:v('--bg'),gold:v('--gold'),indigo:v('--indigo'),fg:v('--fg'),surface:v('--surface'),tint:v('--tint'),bad:v('--bad'),line:v('--line')};
  RUN.last=performance.now();cancelAnimationFrame(RUN.raf);RUN.raf=requestAnimationFrame(runFrame);
}
AFTER.runner=()=>{if(S.g&&S.g.phase==='play'&&S.g.game==='runner')runnerStart();else{const c=$('#rcv');if(c&&RUN.cv!==c){RUN.cv=c}}};

/* --- input --- */
function rLeft(){const s=RUN.st;if(s&&!s.dead&&s.lane>0){s.lane--;sfx('tick')}}
function rRight(){const s=RUN.st;if(s&&!s.dead&&s.lane<2){s.lane++;sfx('tick')}}
function rJump(){const s=RUN.st;if(s&&!s.dead&&s.h<=.02&&s.slide<=0){s.vy=3.3;sfx('jump')}}
function rSlide(){const s=RUN.st;if(s&&!s.dead){s.slide=.6;if(s.h>0)s.vy=-4}}
ACT.rleft=rLeft;ACT.rright=rRight;ACT.rjump=rJump;ACT.rslide=rSlide;
document.addEventListener('keydown',e=>{
  if(!RUN.st||S.view!=='runner'||(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)))return;
  const k=e.key,m={ArrowLeft:rLeft,a:rLeft,A:rLeft,ArrowRight:rRight,d:rRight,D:rRight,ArrowUp:rJump,w:rJump,W:rJump,' ':rJump,ArrowDown:rSlide,s:rSlide,S:rSlide}[k];
  if(m){e.preventDefault();m()}
});
let swipe=null;
document.addEventListener('touchstart',e=>{if(e.target.id==='rcv'&&e.touches[0])swipe={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{
  if(!swipe||!e.changedTouches[0])return;const dx=e.changedTouches[0].clientX-swipe.x,dy=e.changedTouches[0].clientY-swipe.y;swipe=null;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))dx<0?rLeft():rRight();else dy<0?rJump():rSlide();
},{passive:true});

/* --- simulation --- */
function runSpawn(s){
  /* Each row has 1-2 obstacles; at least one lane is always free of full blocks. */
  const lanes=shuf([0,1,2]),n=Math.random()<.35?2:1,types=['low','low','high','block'];
  const safe=lanes[2];
  for(let i=0;i<n;i++){
    let t=types[Math.floor(Math.random()*types.length)];
    if(n===2&&t!=='block')t=Math.random()<.5?'low':'high';
    s.obs.push({lane:lanes[i],p:0,type:t,hit:false});
  }
  if(Math.random()<.8){const l=n===2?safe:lanes[Math.floor(Math.random()*3)];
    for(let k=0;k<4;k++)s.obs.push({lane:l,p:-k*.07,type:'coin',got:false})}
}
function runUpdate(dt){
  const s=RUN.st;s.t+=dt;
  s.spd=Math.min(2,1+s.t*.025);
  s.lx+=(s.lane-s.lx)*Math.min(1,dt*14);
  if(s.h>0||s.vy>0){s.vy-=9*dt;s.h=Math.max(0,s.h+s.vy*dt);if(s.h===0&&s.vy<0)s.vy=0}
  if(s.slide>0)s.slide-=dt;
  s.dist+=dt*s.spd*14;s.off=(s.off+dt*s.spd*.9)%1;
  s.spawn-=dt;if(s.spawn<=0){runSpawn(s);s.spawn=Math.max(.5,1.25-s.spd*.38)+Math.random()*.25}
  for(const o of s.obs){
    if(o.p<0){o.p+=dt*.3;continue}
    o.p+=(.28+o.p*.9)*s.spd*dt;
    if(o.type==='coin'){
      if(!o.got&&o.p>.8&&o.p<1&&Math.abs(o.lane-s.lx)<.55&&(s.h<.9)){o.got=true;s.coins++;sfx('coin')}
    }else if(!o.hit&&o.p>.76&&o.p<1&&Math.abs(o.lane-s.lx)<.5){
      const clear=o.type==='low'?s.h>.22:o.type==='high'?s.slide>0:false;
      if(!clear){o.hit=true;s.dead=true;s.hitT=0;sfx('hit')}
    }
  }
  s.obs=s.obs.filter(o=>o.p<1.15&&!(o.type==='coin'&&o.got));
}
const rScore=s=>Math.floor(s.dist)+s.coins*10;

/* --- drawing --- */
function runDraw(){
  const s=RUN.st,c=RUN.cx,k=RUN.col;
  /* sky */
  const gr=c.createLinearGradient(0,0,0,HOR);gr.addColorStop(0,k.hero);gr.addColorStop(1,k.indigo);c.fillStyle=gr;c.fillRect(0,0,RW,HOR+2);
  c.fillStyle=k.gold;c.beginPath();c.arc(270,70,24,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<6;i++){const bx=i*64-((s.dist*.3)%64),bh=26+((i*37)%30);c.fillRect(bx,HOR-bh,44,bh)}
  /* ground and road */
  c.fillStyle=k.bg;c.fillRect(0,HOR,RW,RH-HOR);
  c.fillStyle=k.hero;c.beginPath();c.moveTo(laneX(0,0)-26,HOR);c.lineTo(laneX(2,0)+26,HOR);c.lineTo(laneX(2,1)+70,RH);c.lineTo(laneX(0,1)-70,RH);c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;
  for(const e of[.5,1.5]){c.beginPath();c.moveTo(RW/2+(e-1)*26,HOR);c.lineTo(RW/2+(e-1)*130+0,RH);c.stroke()}
  c.strokeStyle='rgba(255,255,255,.18)';
  for(let i=0;i<10;i++){const p=((i/10+s.off/10*1)%1),y=groundY(p);c.lineWidth=1+p*2;c.beginPath();c.moveTo(laneX(0,p)-(26+104*p)/1.4,y);c.lineTo(laneX(2,p)+(26+104*p)/1.4,y);c.stroke()}
  /* things, far to near */
  const list=s.obs.filter(o=>o.p>=0).sort((a,b)=>a.p-b.p);
  for(const o of list){
    if(o.p>PL_P&&!s.drawnPlayer){drawPlayer(s,c,k);s.drawnPlayer=true}
    drawThing(o,c,k)}
  if(!s.drawnPlayer)drawPlayer(s,c,k);s.drawnPlayer=false;
  /* hud */
  c.fillStyle='rgba(0,0,0,.35)';c.fillRect(0,0,RW,34);
  c.fillStyle='#fff';c.font='700 16px sans-serif';c.textBaseline='middle';c.textAlign='left';c.fillText('Score '+rScore(s),10,17);
  c.textAlign='right';c.fillText('Cowries '+s.coins,RW-10,17);
  c.fillStyle='rgba(255,255,255,.3)';c.fillRect(RW/2-40,26,80,4);c.fillStyle=k.gold;c.fillRect(RW/2-40,26,80*((s.coins%COWRIES_PER_PIECE)/COWRIES_PER_PIECE),4);
}
function drawThing(o,c,k){
  const x=laneX(o.lane,o.p),y=groundY(o.p),sc=scaleOf(o.p);
  if(o.type==='coin'){
    c.fillStyle=k.gold;c.strokeStyle='#7a5a00';c.lineWidth=1.5;c.beginPath();c.ellipse(x,y-26*sc,10*sc,13*sc,0,0,7);c.fill();c.stroke();
    c.beginPath();c.moveTo(x,y-36*sc);c.lineTo(x,y-16*sc);c.stroke();return}
  const w=78*sc;
  if(o.type==='low'){c.fillStyle='#8a5a2b';c.fillRect(x-w/2,y-26*sc,w,12*sc);c.fillStyle='#5b3a1a';c.fillRect(x-w/2,y-14*sc,6*sc,14*sc);c.fillRect(x+w/2-6*sc,y-14*sc,6*sc,14*sc)}
  else if(o.type==='high'){c.fillStyle='#5b3a1a';c.fillRect(x-w/2,y-84*sc,6*sc,84*sc);c.fillRect(x+w/2-6*sc,y-84*sc,6*sc,84*sc);c.fillStyle=k.bad;c.fillRect(x-w/2,y-84*sc,w,20*sc);c.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<4;i++)c.fillRect(x-w/2+(i*2+.5)*w/8,y-84*sc,w/8,20*sc)}
  else{c.fillStyle=k.bad;c.fillRect(x-w/2,y-70*sc,w,70*sc);c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2*sc+.5;c.strokeRect(x-w/2+5*sc,y-65*sc,w-10*sc,60*sc);c.beginPath();c.moveTo(x-w/2+5*sc,y-65*sc);c.lineTo(x+w/2-5*sc,y-5*sc);c.stroke()}
}
function drawPlayer(s,c,k){
  const p=PL_P,x=laneX(s.lx,p),gy=groundY(p),sc=scaleOf(p),lift=s.h*80*sc,sl=s.slide>0;
  c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(x,gy,22*sc*(1-s.h*.25),6*sc,0,0,7);c.fill();
  const flash=s.dead&&Math.floor(s.hitT*12)%2===0;
  const bodyH=(sl?24:46)*sc,top=gy-lift-bodyH-14*sc,run=Math.sin(s.t*16)*(s.h>0?0:1);
  c.fillStyle=flash?'#fff':k.gold;c.beginPath();c.arc(x,top,10*sc,0,7);c.fill();
  c.fillStyle=flash?'#fff':k.indigo;c.fillRect(x-11*sc,top+9*sc,22*sc,bodyH-14*sc);
  c.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<3;i++)c.fillRect(x-9*sc,top+13*sc+i*8*sc*(sl?.5:1),18*sc,2*sc);
  c.strokeStyle=k.fg;c.lineWidth=5*sc;c.lineCap='round';
  c.beginPath();c.moveTo(x-5*sc,gy-lift-14*sc);c.lineTo(x-5*sc-run*8*sc,gy-lift);c.moveTo(x+5*sc,gy-lift-14*sc);c.lineTo(x+5*sc+run*8*sc,gy-lift);c.stroke();
}
function runFrame(now){
  const s=RUN.st;if(!s||S.view!=='runner'||!S.g||S.g.phase!=='play')return;
  const dt=Math.min(.05,(now-RUN.last)/1000);RUN.last=now;
  if(!s.dead)runUpdate(dt);else s.hitT+=dt;
  runDraw();
  if(s.dead&&s.hitT>.9){
    const score=rScore(s),pieces=Math.floor(s.coins/COWRIES_PER_PIECE),coins=s.coins,dist=Math.floor(s.dist);
    runStop();
    finishGame(GAMES[2],{score,coins,pieces,xp:Math.min(40,5+Math.floor(score/120)),lines:[`You ran ${dist} m and collected ${coins} cowries.`,pieces?`${COWRIES_PER_PIECE} cowries = 1 tower piece. You earned ${pieces}.`:`Collect ${COWRIES_PER_PIECE} cowries in one run to earn a tower piece.`]});
    return;
  }
  RUN.raf=requestAnimationFrame(runFrame);
}

function runnerView(){
  if(overPhase('runner'))return gameOver();
  const g=S.g;
  if(!g||g.game!=='runner')return intro(GAMES[2],'Run down the market road. Switch lanes to dodge crates, jump over low hurdles and slide under high bars. Grab cowries: every 15 in one run adds a piece to your tower. The game speeds up the longer you last.<br><span class="meta">Keys: ← → switch lanes, ↑ or Space jump, ↓ slide. On a phone: swipe, or use the buttons.</span>','Start running');
  return `<div class="runwrap"><canvas id="rcv" width="${RW}" height="${RH}" aria-label="Cowrie Run game. Use arrow keys or swipe."></canvas>
    <div class="pad"><button data-act="rleft" aria-label="Move left">◀</button><button data-act="rjump" aria-label="Jump">▲ Jump</button><button data-act="rslide" aria-label="Slide">▼ Slide</button><button data-act="rright" aria-label="Move right">▶</button></div></div>`;
}
VIEWS.runner=runnerView;

/* ===== 12-game-scramble-speed.js  Game 4: Word Scramble.  Game 5: Speed Quiz. ===== */

/* ================= WORD SCRAMBLE ================= */
/* Splits a word into letters, keeping tone marks and underdots attached to their letter (and "gb" together). */
function letters(w){
  const out=[];for(const ch of String(w).normalize('NFD')){
    if(/[̀-ͯ]/.test(ch)&&out.length)out[out.length-1]+=ch;
    else if(ch.toLowerCase()==='b'&&out.length&&out[out.length-1].toLowerCase()==='g')out[out.length-1]+=ch;
    else out.push(ch)}
  return out;
}
let scrTimer=0,scrNext=0;
function scrStop(){clearInterval(scrTimer);clearTimeout(scrNext);scrTimer=0}
STOPS.push(scrStop);
const SCR_SECS=90,SCR_WORDS=7;
function scrWord(it){
  const L=letters(it.yo);let t;
  for(let i=0;i<12;i++){t=shuf(L.map((s,k)=>({s,id:k})));if(t.map(x=>x.s).join('')!==L.join(''))break}
  return{it,L,tiles:t,placed:[],hint:0,penalty:0,solved:false};
}
ACT.startscramble=()=>{
  scrStop();
  const pool=poolFor(i=>{if(/[\s-]/.test(i.yo)||unit(i.unit).build)return false;const n=letters(i.yo).length;return n>=3&&n<=8},SCR_WORDS+3);
  if(pool.length<SCR_WORDS){toast('Finish a lesson or two first so there are words to unscramble.');return}
  const words=shuf(pool).slice(0,SCR_WORDS).map(scrWord);
  S.g={phase:'play',game:'scramble',words,wi:0,score:0,solved:0,left:SCR_SECS};
  scrTimer=setInterval(()=>{const g=S.g;if(!g||g.game!=='scramble'||g.phase!=='play')return;g.left--;const e=$('#stime');if(e)e.textContent=g.left+'s';if(g.left<=0)scrEnd()},1000);
  render();
};
function scrEnd(){
  const g=S.g;scrStop();
  const score=g.score+(g.solved===SCR_WORDS?g.left*5:0);
  finishGame(GAMES[3],{score,xp:5+g.solved*4,lines:[`${g.solved} of ${SCR_WORDS} words${g.solved===SCR_WORDS?`, with ${g.left} seconds to spare`:''}.`]});
}
function scrAdvance(){
  const g=S.g;if(!g||g.phase!=='play')return;
  g.wi++;if(g.wi>=g.words.length)scrEnd();else render();
}
function scrCheck(){
  const g=S.g,w=g.words[g.wi];
  if(w.placed.length!==w.L.length)return;
  const got=w.placed.map(id=>w.tiles.find(t=>t.id===id).s).join('').normalize('NFD');
  if(got===w.L.join('').normalize('NFD')){
    w.solved=true;g.solved++;g.score+=Math.max(20,100-w.penalty);sfx('ok');render();
    clearTimeout(scrNext);scrNext=setTimeout(scrAdvance,1100);
  }else{sfx('bad');w.shake=true;render();w.shake=false}
}
ACT.sput=d=>{const g=S.g,w=g&&g.words&&g.words[g.wi];if(!w||w.solved||w.placed.includes(+d.id))return;w.placed.push(+d.id);sfx('tick');render();scrCheck()};
ACT.stake=d=>{const g=S.g,w=g&&g.words&&g.words[g.wi];if(!w||w.solved)return;w.placed.splice(+d.k,1);render()};
ACT.sclear=()=>{const w=S.g.words[S.g.wi];if(!w.solved){w.placed=[];render()}};
ACT.shint=()=>{
  const g=S.g,w=g.words[g.wi];if(w.solved)return;
  /* keep the correct letters already in place, then add the next right one */
  let k=0;while(k<w.placed.length&&w.tiles.find(t=>t.id===w.placed[k]).s===w.L[k])k++;
  w.placed=w.placed.slice(0,k);
  const t=w.tiles.find(t=>t.s===w.L[k]&&!w.placed.includes(t.id));
  if(t){w.placed.push(t.id);w.penalty+=40;sfx('tick');render();scrCheck()}
};
ACT.sskip=()=>{const g=S.g;if(g&&g.words[g.wi]&&!g.words[g.wi].solved)scrAdvance()};
function scrambleView(){
  if(overPhase('scramble'))return gameOver();
  const g=S.g;
  if(!g||g.game!=='scramble')return intro(GAMES[3],`Unscramble ${SCR_WORDS} words in ${SCR_SECS} seconds. Tap letters in order, tone marks included. Each word is worth up to 100 points; a hint costs 40.`,'Start the clock');
  const w=g.words[g.wi];
  return `<div class="gbar"><span>Word <b>${g.wi+1}</b>/${g.words.length}</span><span>Score <b>${g.score}</b></span><span><b id="stime">${g.left}s</b></span></div>
  <div class="panel cen"><div class="q-label" style="margin-top:0">Meaning</div><div class="prompt" style="font-size:1.4rem">${esc(w.it.en)}</div>
    <div class="slots sc" style="justify-content:center" aria-label="Your answer">${w.L.map((_,k)=>{const id=w.placed[k];return id===undefined?`<span class="tok blank" aria-hidden="true"></span>`
      :`<button class="tok${w.solved?' okt':''}" data-act="stake" data-k="${k}" ${w.solved?'disabled':''}>${esc(w.tiles.find(t=>t.id===id).s.normalize('NFC'))}</button>`}).join('')}</div>
    <div class="bank" style="justify-content:center">${w.tiles.map(t=>`<button class="tok${w.placed.includes(t.id)?' used':''}" data-act="sput" data-id="${t.id}" ${w.solved?'disabled':''}>${esc(t.s.normalize('NFC'))}</button>`).join('')}</div>
    ${w.solved?`<div class="fb ok" style="text-align:left"><b>Correct</b><span class="yo">${esc(w.it.yo)}</span></div>`:`<div class="row"><button class="btn alt" data-act="sclear">Clear</button><button class="btn alt" data-act="shint">Hint (−40)</button><button class="btn alt" data-act="sskip">Skip</button></div>`}</div>`;
}
VIEWS.scramble=scrambleView;

/* ================= SPEED QUIZ ================= */
let spdTimer=0,spdNext=0;
function spdStop(){clearInterval(spdTimer);clearTimeout(spdNext);spdTimer=0}
STOPS.push(spdStop);
const SPD_SECS=60;
function spdQ(){
  const pool=poolFor(i=>!unit(i.unit).build&&i.yo.length<=26&&i.en.length<=36,12);
  const it=pool[Math.floor(Math.random()*pool.length)];
  return mcQ(it,Math.random()<.5?'yo2en':'en2yo',pool);
}
ACT.startspeed=()=>{
  spdStop();
  S.g={phase:'play',game:'speed',score:0,lives:3,combo:0,best:0,right:0,total:0,left:SPD_SECS,q:spdQ(),pick:null};
  spdTimer=setInterval(()=>{const g=S.g;if(!g||g.game!=='speed'||g.phase!=='play')return;g.left--;
    const e=$('#qtime'),b=$('#qbar');if(e)e.textContent=g.left+'s';if(b)b.style.width=(g.left/SPD_SECS*100)+'%';
    if(g.left<=0)spdEnd()},1000);
  render();
};
function spdEnd(){
  const g=S.g;spdStop();
  finishGame(GAMES[4],{score:g.score,xp:5+Math.floor(g.score/25),lines:[`${g.right} of ${g.total} right. Best combo ${g.best}.`]});
}
ACT.sans=d=>{
  const g=S.g;if(!g||g.phase!=='play'||g.pick!==null)return;
  const ok=d.v===g.q.answer;g.pick=d.v;g.total++;
  if(ok){g.right++;g.combo++;g.best=Math.max(g.best,g.combo);g.score+=10*Math.min(4,1+Math.floor(g.combo/3))}
  else{g.combo=0;g.lives--}
  sfx(ok?'ok':'bad');render();
  clearTimeout(spdNext);spdNext=setTimeout(()=>{if(S.g!==g||g.phase!=='play')return;if(g.lives<=0){spdEnd();return}g.q=spdQ();g.pick=null;render()},ok?350:900);
};
function speedView(){
  if(overPhase('speed'))return gameOver();
  const g=S.g;
  if(!g||g.game!=='speed')return intro(GAMES[4],`${SPD_SECS} seconds, three lives. Answer as fast as you can. Three right in a row raises your multiplier, up to 4×. A wrong answer costs a life and resets the combo.`,'Start the clock');
  const q=g.q,mult=Math.min(4,1+Math.floor(g.combo/3));
  return `<div class="gbar"><span>Score <b>${g.score}</b></span><span>${'♥'.repeat(Math.max(0,g.lives))}${'♡'.repeat(3-Math.max(0,g.lives))}</span><span>×<b>${mult}</b></span><span><b id="qtime">${g.left}s</b></span></div>
  <div class="bar" style="height:8px;margin:2px 0 4px" aria-hidden="true"><i id="qbar" style="width:${g.left/SPD_SECS*100}%"></i></div>
  <div class="panel"><div class="q-label" style="margin-top:0">${q.dir==='yo2en'?'What does this mean?':'How do you say this in Yorùbá?'}</div>
    <div class="prompt${q.dir==='yo2en'?' yo':''}">${esc(q.prompt)}</div>
    <div class="opts">${q.options.map(o=>{let cl='opt'+(q.dir==='en2yo'?' yo':'');if(g.pick!==null){if(o===q.answer)cl+=' right';else if(o===g.pick)cl+=' wrong'}
      return `<button class="${cl}" data-act="sans" data-v="${esc(o)}" ${g.pick!==null?'disabled':''}>${esc(o)}</button>`}).join('')}</div></div>`;
}
VIEWS.speed=speedView;

/* ===== 13-home-profile-write.js  Home page, Profile (stats, daily goal, sound, badges, reset), Writing Lab (Courses 16 and 21) ===== */

/* ---------- home ---------- */

 {v:'courses',i:'courses',t:'Courses',d:'21 courses in four tiers, from first greetings to proverbs.'},

  const pool=uniqBy(ALL.filter(i=>!unit(i.unit).build&&i.yo.length<=20&&i.en.length<=40),i=>i.yo);
  const d=new Date(),n=d.getFullYear()*372+d.getMonth()*31+d.getDate();return pool[n%pool.length];
}

const WPROMPTS=[
 ['Introduce yourself','Write 2 to 4 short sentences: your name, where you live, and one thing you like.','b'],
 ['My family','Describe the people in your family with a few simple sentences.','b'],
 ['My day','Say what you do in the morning and at night. Use ń, ti or máa if you can.','i'],
 ['At the market','Write a short conversation or story about buying food.','i'],
 ['Explain your opinion','Tell us what you think about school or phones, and give one reason with nítorí pé.','a'],
 ['A letter to an elder','Write a short, respectful greeting and say what you are learning.','a'],
 ['A tiny story','Write 4 to 6 sentences of any story you like.','a']];
let SAMPLE_W=null;
const wrk=()=>S.wr||(S.wr={p:0,text:'',res:null,busy:false,err:'',paid:{}});
function knownShare(text){
  const known=new Set(ALL.flatMap(i=>i.yo.split(/\s+/)).map(w=>wnorm(w.replace(/[.,!?;:“”"()]/g,''))).filter(Boolean));
  const toks=text.split(/\s+/).map(w=>wnorm(w.replace(/[.,!?;:“”"()]/g,''))).filter(Boolean);
  return{n:toks.length,k:toks.filter(t=>known.has(t)).length};
}
function writeView(){
  const W=wrk(),pr=WPROMPTS[W.p],r=W.res,ks=knownShare(W.text||'');

  <div class="panel"><div class="eyebrow muted">${{b:'Beginner',i:'Intermediate',a:'Advanced'}[pr[2]]} prompt</div><p style="margin:8px 0 12px">${esc(pr[1])}</p>
    <textarea id="wtext" class="search" rows="6" placeholder="Write in Yorùbá here. Tone marks and underdots help, but you can add them later." aria-label="Your writing" ${W.busy?'disabled':''}></textarea>
    <div class="keys" style="margin-top:8px" aria-label="Special letters">${['ẹ','ọ','ṣ','à','á','è','é','ì','í','ò','ó','ù','ú'].map(k=>`<button class="key" data-act="wins" data-c="${k}">${k}</button>`).join('')}</div>
    <div class="row" style="justify-content:space-between;align-items:center"><span class="meta" id="wstat">${ks.n} words · ${ks.k} from your lessons</span>
      <button class="btn" data-act="wcheck" ${W.busy||!SAMPLE?'disabled':''}>${W.busy?'Checking…':'Check my writing'}</button></div>
    ${SAMPLE===null?'<div class="fb no">Checking needs Claude, which is not available where you opened this page. You can still write and count words.</div>':''}
    ${W.err?`<div class="fb no">${esc(W.err)}</div>`:''}</div>
  ${r?`<div class="panel"><div class="eyebrow muted">Feedback</div>${stars(r.stars)}<p style="margin:6px 0 0;text-align:center">${esc(r.summary)}</p>
    ${r.corrected?`<div class="rsec"><div class="q-label">Polished version</div><div class="prov">${esc(r.corrected)}</div>${spkBtn(r.corrected)}</div>`:''}
    ${r.issues.length?`<div class="rsec"><div class="q-label">Fixes</div><ul class="l">${r.issues.map(x=>`<li><span class="said">${esc(x.said)}</span> → <span class="yo">${esc(x.better)}</span><br><span class="meta">${esc(x.why)}</span></li>`).join('')}</ul></div>`:''}
    ${r.next?`<div class="note" style="margin-top:14px"><b>Next:</b> ${esc(r.next)}</div>`:''}
    <p class="fine">Feedback comes from Claude and can make mistakes, especially with tone marks. Check anything important with a Yorùbá speaker.</p></div>`:''}`;
}
function cleanWrite(r){r=r||{};const n=Math.max(1,Math.min(5,Math.round(Number(r.stars))||3));
  return{stars:n,summary:String(r.summary||''),corrected:String(r.corrected||''),next:String(r.next||''),
    issues:(Array.isArray(r.issues)?r.issues:[]).slice(0,6).map(x=>({said:String(x&&x.said||''),better:String(x&&x.better||''),why:String(x&&x.why||'')}))}}
ACT.wprompt=d=>{const W=wrk();W.text=($('#wtext')||{}).value||W.text;W.p=+d.i;W.res=null;W.err='';W.text='';render()};
ACT.wins=d=>{const el=$('#wtext');if(!el)return;const s=el.selectionStart==null?el.value.length:el.selectionStart,e2=el.selectionEnd==null?s:el.selectionEnd;el.setRangeText(d.c,s,e2,'end');wrk().text=el.value;el.focus();updWStat()};
function updWStat(){const e=$('#wstat');if(e){const k=knownShare(wrk().text||'');e.textContent=`${k.n} words · ${k.k} from your lessons`}}
document.addEventListener('input',e=>{if(e.target.id==='wtext'){wrk().text=e.target.value;updWStat()}});
ACT.wcheck=async()=>{
  const W=wrk(),el=$('#wtext');if(el)W.text=el.value;
  const text=(W.text||'').trim();
  if(!SAMPLE){return}
  if(text.split(/\s+/).length<3){W.err='Write at least a few words first.';render();return}
  W.busy=true;W.err='';render();
  const pr=WPROMPTS[W.p],lvl={b:'beginner',i:'intermediate',a:'advanced'}[pr[2]];
  const prompt=`You are a kind Yorùbá teacher checking writing from a teenage ${lvl} learner. Prompt they were given: "${pr[1]}"\nTheir text:\n"""${text}"""\n\nCheck spelling, word choice, word order, grammar and tone marks or underdots that change meaning. Do not penalise missing diacritics; mention them once as a tip. If you are not sure about a correction, say so in "why". Reply with ONLY one JSON object and no other text, in this shape:\n{"stars":4,"summary":"two short, encouraging sentences","corrected":"their text corrected, with tone marks and underdots","issues":[{"said":"the part they wrote","better":"the better Yorùbá","why":"one short teen-friendly sentence"}],"next":"one short suggestion for what to try next"}\nstars is a whole number 1 to 5. issues has up to 5 items.`;
  try{
    const r=await SAMPLE.json(prompt,{cache:false});
    W.res=cleanWrite(r);W.busy=false;
    if(!W.paid[W.p]){W.paid[W.p]=true;P.writes++;addXP(15)}
  }catch(e){W.busy=false;W.err=sampleErr(e)}
  render();
};
AFTER.write=()=>{const el=$('#wtext');if(el)el.value=wrk().text||''};
VIEWS.write=writeView;

/* ===== 14-games-voice.js  Games 6-8: the "say it out loud" games.
     Say It   - see a word, say it.
     Echo     - see a phrase for 3 seconds, then say it from memory.
     Recall   - see only the English, say the Yorùbá.
   HOW THE CHECK WORKS (honest version):
   1. Auto-check: if the browser has speech recognition (SpeechRecognition), the game listens and compares what it heard
      with the target, ignoring tone marks. Yorùbá is poorly supported by browsers, so it can miss words that were said
      correctly. A "Count it" button lets you overrule it.
   2. Self-check: if the browser has no recognition, or the page may not use the microphone (as in a published Claude
      artifact), you say it out loud and then rate yourself. Nothing is recorded or sent anywhere.
   The game switches to self-check on its own if auto-check fails. ===== */

const VSR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
const VLANGS=['yo-NG','yo'];
let vRec=null,vTimer=0;
function vStop(){clearInterval(vTimer);vTimer=0;try{if(vRec){vRec.onresult=vRec.onerror=vRec.onend=null;vRec.abort()}}catch(e){}vRec=null}
STOPS.push(vStop);

/* Similarity 0..1 between what was heard and the target, ignoring tone marks, case and punctuation. */
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const vnorm=s=>wnorm(s).replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function similarity(heard,target){const a=vnorm(heard),b=vnorm(target);if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length)}

const VGAMES={
 say:{n:8,pool:()=>poolFor(i=>!unit(i.unit).build&&i.yo.split(' ').length<=2&&i.yo.length<=16&&i.en.length<=36,12),
  ask:'Say this word out loud'},
 echo:{n:6,pool:()=>poolFor(i=>{const w=i.yo.split(' ').length;return w>=2&&w<=5&&i.yo.length<=34&&i.en.length<=60},8),
  ask:'Remember it, then say it'},
 recall:{n:8,pool:()=>poolFor(i=>!unit(i.unit).build&&i.yo.split(' ').length<=3&&i.yo.length<=22&&i.en.length<=34,12),
  ask:'Say this in Yorùbá'}};

/* current check mode: 'auto' when the browser can listen, 'self' otherwise */
const vMode=()=>S.vmode||(S.vmode=VSR?'auto':'self');

function startVoice(id){
  vStop();
  const cfg=VGAMES[id],items=shuf(cfg.pool()).slice(0,cfg.n);
  if(items.length<4){toast('Finish a lesson or two first so there are words to play with.');return}
  S.g={phase:'play',game:id,items,i:0,step:id==='echo'?'show':'prep',score:0,right:0,combo:0,tries:0,heard:'',ok:null,pts:0,note:'',count:3,lang:0};
  render();vArm();
}
ACT.startsay=()=>startVoice('say');
ACT.startecho=()=>startVoice('echo');
ACT.startrecall=()=>startVoice('recall');
ACT.vmode=()=>{S.vmode=vMode()==='auto'?'self':'auto';render()};

/* Echo: the phrase is visible for 3 seconds, then it hides. */
function vArm(){
  const g=S.g;vStop();if(!g||g.game!=='echo'||g.step!=='show')return;
  g.count=3;
  vTimer=setInterval(()=>{if(S.g!==g)return vStop();g.count--;if(g.count<=0){vStop();g.step='prep';render()}else{const e=$('#vcount');if(e)e.textContent=g.count}},1000);
}

/* Start speaking */
ACT.vsay=()=>{
  const g=S.g;if(!g||g.step!=='prep')return;
  const it=g.items[g.i];
  if(vMode()==='auto'&&VSR){
    g.step='listen';g.note='';render();
    let done=false;const finish=r=>{if(done)return;done=true;vStop();vResult(r)};
    try{
      vRec=new VSR();vRec.lang=VLANGS[g.lang]||'yo-NG';vRec.interimResults=false;vRec.maxAlternatives=5;vRec.continuous=false;
      vRec.onresult=e=>finish({alts:[...e.results[0]].map(x=>x.transcript)});
      vRec.onerror=e=>finish({err:e.error});
      vRec.onend=()=>finish({err:'no-speech'});
      vRec.start();
      setTimeout(()=>{if(!done)try{vRec&&vRec.stop()}catch(e){}},7000);
    }catch(e){finish({err:'start-failed'})}
  }else{
    /* self-check: a 4-second window to say it, then rate yourself */
    g.step='self';g.count=4;render();
    vTimer=setInterval(()=>{if(S.g!==g)return vStop();g.count--;if(g.count<=0){vStop();g.step='rate';render()}else{const e=$('#vcount');if(e)e.textContent=g.count}},1000);
  }
};
function vResult(r){
  const g=S.g;if(!g||g.step!=='listen')return;
  if(r.err){
    if(r.err==='language-not-supported'&&g.lang<VLANGS.length-1){g.lang++;g.step='prep';render();return ACT.vsay()}
    if(r.err==='no-speech'||r.err==='aborted'){g.step='prep';g.note='I did not hear anything. Tap the microphone and try again.';render();return}
    /* blocked or unavailable: switch to self-check for the rest of the session */
    S.vmode='self';g.step='prep';g.note=r.err==='not-allowed'||r.err==='service-not-allowed'
      ?'This page cannot use your microphone here, so the game switched to self-check: say it out loud, then rate yourself.'
      :'Speech recognition is not working in this browser, so the game switched to self-check.';
    render();return;
  }
  const it=g.items[g.i],best=Math.max(...r.alts.map(a=>similarity(a,it.yo)));
  g.heard=r.alts[0]||'';g.sim=best;g.ok=best>=.7;
  vScore(g.ok?'full':'miss');
}
/* Self-rating: 'full' | 'half' | 'miss' */
function vScore(kind){
  const g=S.g;
  if(kind==='full'){g.right++;g.combo++;g.pts=100+25*Math.min(g.combo-1,4)}
  else if(kind==='half'){g.combo=0;g.pts=50}else{g.combo=0;g.pts=0}
  g.score+=g.pts;g.kind=kind;g.step='res';sfx(kind==='miss'?'bad':'ok');render();
}
ACT.vrate=d=>{if(S.g&&S.g.step==='rate')vScore(d.k)};
ACT.vcount=()=>{const g=S.g;if(g&&g.step==='res'&&g.kind==='miss'&&g.heard){g.score-=g.pts;g.right++;g.combo++;g.pts=100;g.score+=100;g.kind='full';g.ok=true;sfx('ok');render()}};
ACT.vlisten=()=>{const g=S.g;if(g){const it=g.items[g.i];if(!speak(it.yo))playSeq([...toneOf(it.yo)])}};
ACT.vnext=()=>{
  const g=S.g;vStop();g.i++;
  if(g.i>=g.items.length){
    const gm=GAMES.find(x=>x.id===g.game);
    finishGame(gm,{score:g.score,xp:6+g.right*3,pieces:g.right,lines:[`${g.right} of ${g.items.length} said well.`,vMode()==='auto'?'Checked by speech recognition, which can miss Yorùbá.':'Self-checked, so this score is on the honor system.']});
    return;
  }
  g.step=g.game==='echo'?'show':'prep';g.count=3;g.heard='';g.ok=null;g.note='';g.kind=null;render();vArm();
};

function voiceView(id){
  if(overPhase(id))return gameOver();
  const gm=GAMES.find(x=>x.id===id),g=S.g;
  const auto=vMode()==='auto'&&VSR;
  if(!g||g.game!==id){
    const text={say:'A word appears. Say it out loud. Then you get points and, if you nailed it, a tower piece.',
      echo:'A phrase shows for 3 seconds. Memorize it, then say it out loud after it disappears.',
      recall:'Only the English shows. Say the Yorùbá out loud from memory, then see how you did.'}[id];
    return intro(gm,text+`<br><span class="meta">${auto?'Auto-check: your browser will listen and compare what it hears. Yorùbá recognition is shaky, so you can overrule it.':'Self-check: nothing is recorded. You say it out loud, then rate yourself.'}</span>`,'Start')+
      (VSR?`<div class="row"><button class="chip${auto?' on':''}" data-act="vmode" aria-pressed="${auto}">Auto-check: ${auto?'on':'off'}</button></div>`:'<p class="fine" style="text-align:center">This browser has no speech recognition, so the game uses self-check.</p>');
  }
  const it=g.items[g.i],cfg=VGAMES[id];
  const revealed=['res','rate'].includes(g.step);
  const hidden=id==='echo'&&g.step!=='show'&&!revealed;
  const showYo=!hidden&&!(id==='recall'&&!revealed);
  let body='';
  if(g.step==='show')body=`<div class="meta" style="margin-top:10px">Memorize it. Hiding in <b id="vcount">${g.count}</b>…</div><div class="row"><button class="btn alt" data-act="vlisten">▶ Hear it</button></div>`;
  else if(g.step==='prep')body=`${g.note?`<div class="fb tip" style="margin:10px 0 0"><span>${esc(g.note)}</span></div>`:''}<div class="row"><button class="btn mic" data-act="vsay" aria-label="Start speaking">🎤 Say it</button>${id==='say'?'<button class="btn alt" data-act="vlisten">▶ Hear it</button>':''}</div>${id==='recall'?'':''}`;
  else if(g.step==='listen')body=`<div class="listening" role="status"><span></span><span></span><span></span></div><p class="meta" style="text-align:center;margin:6px 0 0">Listening… say it now</p>`;
  else if(g.step==='self')body=`<div class="listening" role="status"><span></span><span></span><span></span></div><p style="text-align:center;margin:6px 0 0">Say it out loud now <b id="vcount">${g.count}</b></p>`;
  else if(g.step==='rate')body=`<p style="text-align:center;margin:10px 0 0">How did it go?</p><div class="row"><button class="btn" data-act="vrate" data-k="full">Nailed it</button><button class="btn alt" data-act="vrate" data-k="half">Close</button><button class="btn alt" data-act="vrate" data-k="miss">Missed it</button></div>`;
  else body=`<div class="fb ${g.kind==='miss'?'no':'ok'}"><b>${g.kind==='full'?'Nice! +'+g.pts+(g.right?' · tower piece':''):g.kind==='half'?'Close. +50':'Not this time'}</b>
      <span><span class="yo">${esc(it.yo)}</span> means “${esc(it.en)}”.${g.heard?`<br><span class="meta">Heard: “${esc(g.heard)}”</span>`:''}</span></div>
      <div class="row">${g.kind==='miss'&&g.heard?'<button class="btn alt" data-act="vcount">Count it, I said it right</button>':''}<button class="btn alt" data-act="vlisten">▶ Hear it</button><button class="btn" data-act="vnext">${g.i+1>=g.items.length?'Finish':'Next'}</button></div>`;
  return `<div class="gbar"><span>${g.i+1}<b>/${g.items.length}</b></span><span>Combo <b>${g.combo}</b></span><span>Score <b>${g.score}</b></span></div>
  <div class="panel cen"><div class="q-label" style="margin-top:0">${esc(cfg.ask)}</div>
    ${showYo?`<div class="big yo" style="margin:6px 0">${esc(it.yo)}</div>${id==='say'||revealed?contour(toneOf(it.yo)||'M').replace('<svg','<svg style="max-width:150px;margin:0 auto;display:block"'):''}`:`<div class="big yo" style="margin:6px 0;opacity:.35" aria-label="Hidden">· · ·</div>`}
    <div class="en" style="margin-top:4px">${esc(it.en)}</div>${body}</div>
  <p class="fine">${auto?'Auto-check listens through your microphone using your browser’s speech recognition. Audio is handled by your browser, not by this app.':'Self-check: nothing is recorded.'}</p>`;
}
VIEWS.say=()=>voiceView('say');VIEWS.echo=()=>voiceView('echo');VIEWS.recall=()=>voiceView('recall');

/* ===== 99-main.js  Navigation, hash routing, render loop, event wiring. Loads last. ===== */

const TABS=[['home','Home'],['courses','Courses'],['chat','Chat'],['call','Call'],['games','Games'],['audio','Audio']];
/* Pages with their own address (#name). Lesson screens are not addressable and count as part of Courses. */
const PAGES=['home','courses','chat','call','games','audio','write','words','review','tones','alpha','culture','profile','leaders','match','tower','runner','scramble','speed','say','echo','recall'];
/* Which tab lights up for pages that are not tabs themselves */
const PARENT={learn:'courses',quiz:'courses',results:'courses',course:'courses',leaders:'games',match:'games',tower:'games',runner:'games',scramble:'games',speed:'games',say:'games',echo:'games',recall:'games'};
/* Pages that show a back link: view -> [where it goes, label] */
const BACK={review:['home','All features'],tones:['home','All features'],alpha:['home','All features'],culture:['home','All features'],words:['home','All features'],write:['home','All features'],profile:['home','All features'],
  course:['courses','All courses'],leaders:['games','Game hub'],match:['games','Game hub'],tower:['games','Game hub'],runner:['games','Game hub'],scramble:['games','Game hub'],speed:['games','Game hub'],say:['games','Game hub'],echo:['games','Game hub'],recall:['games','Game hub']};
REG.forEach(id=>{PAGES.push(id);PARENT[id]='games';BACK[id]=['games','Game hub']});   // games added with registerGame()
const ALIAS={alphabet:'alpha',lessons:'courses',listen:'audio'};
const hashOf=v=>v==='alpha'?'alphabet':v;
const fromHash=()=>{const h=(location.hash||'').replace('#','');const v=ALIAS[h]||h;return PAGES.includes(v)?v:'home'};
const pageOf=v=>PAGES.includes(v)?v:(PARENT[v]||'home');
const tabOf=v=>{let x=v;for(let i=0;i<4&&!TABS.some(t=>t[0]===x);i++)x=PARENT[x]||'home';return x};

let curView=null;
function render(){
  const v=VIEWS[S.view]?S.view:'home';
  if(curView!==v){STOPS.forEach(f=>{try{f()}catch(e){}});curView=v}
  const b=BACK[v];
  $('#main').innerHTML=(b?`<button class="back" data-act="tab" data-v="${b[0]}">← ${b[1]}</button>`:'')+VIEWS[v]();
  if(AFTER[v])AFTER[v]();
  const tab=tabOf(v);
  $('#nav').innerHTML=TABS.map(t=>`<button data-act="tab" data-v="${t[0]}" ${t[0]===tab?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t[0]]}</svg>${t[1]}</button>`).join('');
}
function go(v){
  S.view=v;
  if(PAGES.includes(v)){try{if(location.hash!=='#'+hashOf(v))location.hash=hashOf(v)}catch(e){}}
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const v=fromHash();if(v!==pageOf(S.view)){S.view=v;if(GAMES.some(g=>g.id===v))S.g=null;render();window.scrollTo(0,0)}});

/* Opening a page from a tab, card or back link */
ACT.tab=d=>{
  const v=d.v;
  if(v==='review')S.rv=null;
  if(GAMES.some(g=>g.id===v))S.g=null;
  if(v==='courses')S.cid=null;
  go(v);
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled){const h=ACT[b.dataset.act];if(h)h(b.dataset)}});

/* Start */
S.view=fromHash();
render();
loadClips();

</script>
