<title>Èdè Mi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Noto+Sans:wght@400;600&family=Noto+Serif:wght@600;700&display=swap">
<style>
:root{
  --bg:#F2F4FB; --surface:#FFFFFF; --fg:#131A3F; --muted:#515A86; --line:#D6DBF0;
  --indigo:#2A3A9C; --on-indigo:#FFFFFF; --tint:#E3E7F9;
  --hero:#2A3A9C; --on-hero:#FFFFFF; --pat:rgba(255,255,255,.11);
  --gold:#E0A100; --good:#17744A; --good-bg:#DDF3E8; --bad:#B3261E; --bad-bg:#FBE3E0;
  --f-ui:'Bricolage Grotesque','Noto Sans',system-ui,sans-serif;
  --f-body:'Noto Sans',system-ui,sans-serif;
  --f-yo:'Noto Serif','Noto Sans',Georgia,serif;
  --end:#C3322B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1030; --surface:#161C45; --fg:#E9ECFC; --muted:#A5ACD8; --line:#2A3263;
  --indigo:#8D9AFF; --on-indigo:#0C1030; --tint:#222A5C;
  --hero:#18205E; --on-hero:#FFFFFF; --pat:rgba(255,255,255,.08);
  --gold:#F2BC2E; --good:#5ED79B; --good-bg:#12372A; --bad:#FF8F85; --bad-bg:#43191A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1030; --surface:#161C45; --fg:#E9ECFC; --muted:#A5ACD8; --line:#2A3263;
  --indigo:#8D9AFF; --on-indigo:#0C1030; --tint:#222A5C;
  --hero:#18205E; --on-hero:#FFFFFF; --pat:rgba(255,255,255,.08);
  --gold:#F2BC2E; --good:#5ED79B; --good-bg:#12372A; --bad:#FF8F85; --bad-bg:#43191A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto}
.yo{font-family:var(--f-yo);font-weight:700}
h1,h2,h3{font-family:var(--f-ui);text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.eyebrow{font:600 12px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase}

/* hero */
.hero{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:28px max(16px,env(safe-area-inset-left,0px)) 24px;background-color:var(--hero);color:var(--on-hero);
  background-image:radial-gradient(circle,transparent 5px,var(--pat) 5px 7px,transparent 7px),radial-gradient(circle,var(--pat) 0 2px,transparent 2px);
  background-size:34px 34px;background-position:0 0,17px 17px;padding-top:max(28px,env(safe-area-inset-top,0px))}
.hero .wrap{display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;line-height:1.02}
.hero h1 span{font-family:var(--f-yo)}
.hero p{margin:0;max-width:46ch;opacity:.92}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font:600 15px var(--f-ui)}
.stats b{font-size:22px;margin-right:4px}

/* unit list */
.sec{margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec h2{font-size:1.35rem}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.unit{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.unit:hover{border-color:var(--indigo)}
.unit:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.unit .n{grid-row:span 3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--indigo);font:800 18px var(--f-ui)}
.unit.done .n{background:var(--indigo);color:var(--on-indigo)}
.unit h3{font-size:1.05rem}
.unit .yoname{font-family:var(--f-yo);font-weight:600;color:var(--muted);font-size:.9rem}
.bar{height:6px;border-radius:3px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.meta{font-size:.82rem;color:var(--muted)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
.top{display:flex;align-items:center;gap:12px;padding-top:max(18px,env(safe-area-inset-top,0px))}
.top .bar{flex:1;height:10px}
.x{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font:600 22px var(--f-ui);color:var(--muted)}
.x:hover{background:var(--tint)}
.x:focus-visible{outline:3px solid var(--gold)}
.big{font-size:clamp(2rem,9vw,3.2rem);line-height:1.15;text-align:center;overflow-wrap:anywhere}
.cen{text-align:center}
.card{padding:34px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;min-height:240px;justify-content:center}
.card .en{font:600 1.25rem var(--f-ui)}
.note{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:.92rem;max-width:52ch;text-align:left}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.btn{border:0;border-radius:12px;padding:13px 22px;font:700 16px var(--f-ui);background:var(--indigo);color:var(--on-indigo);min-width:120px}
.btn.alt{background:var(--tint);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font:600 17px var(--f-body);min-width:0;overflow-wrap:anywhere}
.opt.yo{font-family:var(--f-yo);font-weight:700;font-size:19px}
.opt:hover:not(:disabled){border-color:var(--indigo)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block;font:800 17px var(--f-ui)}
.fb span{color:var(--fg)}
.q-label{font:600 13px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px}
.prompt{font:700 1.5rem/1.25 var(--f-ui);overflow-wrap:anywhere}
.prompt.yo{font-family:var(--f-yo);font-size:1.9rem}

/* sentence builder */
.slots{min-height:64px;border-bottom:2px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;padding:8px 0;margin-top:14px}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tok{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font:700 18px var(--f-yo)}
.tok.used{visibility:hidden}
.slots .tok{border-color:var(--indigo)}

/* tones */
.tone3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tbtn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tbtn:hover{border-color:var(--indigo)}
.tbtn .m{font:700 2.4rem/1 var(--f-yo)}
.tbtn .nm{font:700 14px var(--f-ui)}
.tbtn .s{font-size:.8rem;color:var(--muted)}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.pair{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--surface);text-align:center}
.pair .w{font:700 2rem var(--f-yo)}
.pair svg{width:100%;max-width:150px;height:auto}
.grp{margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font:600 14px var(--f-ui)}

/* alphabet */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.let{border:2px solid var(--line);background:var(--surface);border-radius:12px;aspect-ratio:1;display:grid;place-items:center;font:700 1.7rem var(--f-yo);min-width:0}
.let.sp{border-color:var(--gold)}
.let[aria-pressed="true"]{background:var(--indigo);color:var(--on-indigo);border-color:var(--indigo)}
.detail{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.detail .L{font:700 3rem/1 var(--f-yo)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav .in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;font:600 12px var(--f-ui);color:var(--muted)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--indigo);background:var(--tint)}
nav button:focus-visible{outline:3px solid var(--gold)}
.fine{font-size:.85rem;color:var(--muted);margin-top:22px}
.src a{color:var(--indigo)}
/* extra pages */
.back{all:unset;cursor:pointer;display:block;color:var(--indigo);font:600 14px var(--f-ui);padding-top:max(16px,env(safe-area-inset-top,0px))}
.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.search{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;font:16px var(--f-body)}
.search:focus-visible{outline:3px solid var(--gold);border-color:var(--indigo)}
button.chip.on{background:var(--indigo);color:var(--on-indigo);border-color:var(--indigo)}
.wrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wy{font-size:1.25rem;overflow-wrap:anywhere}
.cult h3{font-size:1.1rem;margin-bottom:6px}
.cult p{margin:6px 0 0}
.prov{font:700 1.25rem/1.4 var(--f-yo);margin:10px 0 2px;overflow-wrap:anywhere}
.cult a,.fine a{color:var(--indigo)}
/* audio + toast */
.spk{all:unset;cursor:pointer;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--indigo)}
.spk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spk:focus-visible{outline:3px solid var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:min(92vw,420px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;text-align:center}
/* phone call */
.callscr{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 0 24px;text-align:center}
.av{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font:700 2.6rem var(--f-yo);background-color:var(--hero);color:var(--on-hero);background-image:radial-gradient(circle,transparent 5px,var(--pat) 5px 7px,transparent 7px);background-size:22px 22px}
.av.sm{width:46px;height:46px;font-size:1.3rem;background-size:14px 14px;flex:none}
.end{border:0;border-radius:999px;padding:12px 22px;background:var(--end);color:#fff;font:700 15px var(--f-ui)}
.callhead{display:flex;align-items:center;gap:12px;padding-top:max(14px,env(safe-area-inset-top,0px))}
.callhead .who{flex:1;min-width:0}
.callhead h2{font-size:1.1rem}
.thread{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%}
.msg.them{align-self:flex-start;max-width:94%}
.msg.me{align-self:flex-end;max-width:88%}
.bub{border-radius:16px;padding:10px 14px;min-width:0;overflow-wrap:anywhere}
.them .bub{background:var(--surface);border:1px solid var(--line)}
.me .bub{background:var(--indigo);color:var(--on-indigo)}
.cyo{font-size:1.2rem}
.cen2{color:var(--muted);font-size:.9rem;margin-top:2px}
.fbw{align-self:flex-end;max-width:88%;margin-top:-4px}
.fbw .fb{margin-top:0}
.fb.tip{background:var(--tint);color:var(--fg)}
.fb .said{text-decoration:line-through;opacity:.7}
.fb .yo{font-size:1.05rem}
.dock{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 8px;margin-top:14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.keys{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.key{flex:none;min-width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:700 17px var(--f-yo)}
.say{display:flex;gap:8px}
.say input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;font:16px var(--f-body)}
.say input:focus-visible{outline:3px solid var(--gold);border-color:var(--indigo)}
.say .btn{min-width:84px;padding:12px 16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.chip{cursor:pointer;color:var(--fg)}
.stars{display:flex;gap:4px;justify-content:center;margin:10px 0}
.stars svg{width:32px;height:32px}
ul.l{margin:6px 0 0;padding-left:20px}
ul.l li{margin:5px 0}
.rsec{text-align:left;margin-top:18px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}.av.ring{animation:pulse 1.4s ease-out infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 var(--tint)}100%{box-shadow:0 0 0 30px transparent}}}

/* ===== features.css  v4 additions: courses, games, leaderboard, profile, audio lab, writing lab ===== */
.tabs{margin:14px 0 4px}
.tiersec{margin-top:6px}
.unit.course{grid-template-columns:44px 1fr}
.unit.course .cmeta{display:flex;align-items:center;gap:10px}
.unit.course .cmeta .bar{flex:1}
.unit.linkcard .n{background:var(--gold);color:#1b1b1b}
.herogoal{max-width:360px}
.goal{display:flex;flex-direction:column;gap:6px}
.hero .goal .bar{background:rgba(255,255,255,.25)}
.hero .goal .meta{color:var(--on-hero);opacity:.9}
.wotd{display:flex;justify-content:space-between;align-items:center;gap:12px}
details.note summary{cursor:pointer;font-weight:600}
details.panel summary{cursor:pointer}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--tint);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
select.search{appearance:auto}
.filebtn{display:inline-block;cursor:pointer;text-align:center}
.filebtn.disabled{opacity:.5;pointer-events:none}
.filebtn:focus-within{outline:3px solid var(--gold)}
/* game hub */
.towerpanel,.towerplay{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.tw{display:grid;place-items:center;background:var(--tint);border-radius:14px;padding:8px 14px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.gcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.gcard:hover{border-color:var(--indigo)}
.gcard:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gic{width:64px;height:64px;display:grid;place-items:center;border-radius:16px;background:var(--tint);color:var(--indigo)}
.panel .gic{width:auto;height:auto;padding:10px}
.gtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.gtx b{font:800 1.1rem var(--f-ui)}
.yoname{font-family:var(--f-yo);font-weight:600;color:var(--muted);font-size:.9rem}
.gbest{font:700 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);margin-top:4px}
.gbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:14px;font:600 14px var(--f-ui)}
.gbar b{font-size:1.1rem}
/* match */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(min-width:560px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mcard{aspect-ratio:1/1;border:2px solid var(--line);border-radius:14px;background:var(--surface);display:grid;place-items:center;padding:6px;font:700 15px var(--f-body);text-align:center;overflow-wrap:anywhere;min-width:0}
.mcard.yo{font-family:var(--f-yo);font-size:17px}
.mcard .mback{width:100%;height:100%;border-radius:10px;background-color:var(--hero);background-image:radial-gradient(circle,transparent 4px,var(--pat) 4px 6px,transparent 6px);background-size:18px 18px;display:block}
.mcard.up{background:var(--tint);border-color:var(--indigo);color:var(--fg)}
.mcard.ok{background:var(--good-bg);border-color:var(--good);color:var(--fg)}
.mcard:disabled{opacity:1}
/* runner */
.runwrap{max-width:420px;margin:14px auto 0}
#rcv{display:block;width:100%;height:auto;aspect-ratio:360/540;border-radius:16px;border:1px solid var(--line);touch-action:none;background:var(--hero)}
.pad{display:grid;grid-template-columns:1fr 2fr 2fr 1fr;gap:8px;margin-top:10px}
.pad button{border:0;border-radius:12px;padding:14px 4px;font:700 15px var(--f-ui);background:var(--tint);color:var(--fg);touch-action:manipulation}
.pad button:active{background:var(--indigo);color:var(--on-indigo)}
/* scramble */
.slots.sc{border-bottom:0;min-height:60px}
.tok.blank{width:46px;height:46px;border-style:dashed;padding:0}
.tok.okt{border-color:var(--good);background:var(--good-bg)}
/* leaderboard */
ol.lb{list-style:none;margin:0;padding:0}
ol.lb li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
ol.lb li:last-child{border-bottom:0}
ol.lb li.me{background:var(--tint);border-radius:10px;padding-left:10px;padding-right:10px;border-bottom-color:transparent}
ol.lb li.gap{display:block;text-align:center;color:var(--muted);padding:2px}
ol.lb .rk{font:800 1rem var(--f-ui);color:var(--muted)}
ol.lb .nm{min-width:0;overflow-wrap:anywhere;font-weight:600}
ol.lb b{font:800 1rem var(--f-ui)}
i.sim,i.you{font:700 10px var(--f-ui);font-style:normal;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:middle}
i.sim{background:var(--tint);color:var(--muted)}
i.you{background:var(--indigo);color:var(--on-indigo)}
/* profile */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column}
.stat b{font:800 1.5rem var(--f-ui)}
.stat span{font-size:.82rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.badge{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;opacity:.65}
.badge.on{border:2px solid var(--gold);opacity:1}
.badge .bi{font-size:1.4rem;color:var(--gold)}
@media(max-width:480px){.towerpanel,.towerplay{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.mcard{transition:background .15s,border-color .15s}}
nav button{min-width:0}
.tw svg{width:auto;max-width:100%;height:150px}
.tw{min-width:120px}
.btn.mic{font-size:1.1rem;padding:16px 28px}
.listening{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:44px;margin-top:14px}
.listening span{width:8px;height:16px;border-radius:4px;background:var(--indigo)}
@media(prefers-reduced-motion:no-preference){.listening span{animation:eq 0.9s ease-in-out infinite}.listening span:nth-child(2){animation-delay:.15s}.listening span:nth-child(3){animation-delay:.3s}@keyframes eq{0%,100%{height:10px}50%{height:40px}}}

</style>

function ctx(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function beep(f,t0,d,vol){const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;const v=vol||.28;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.03);g.gain.linearRampToValueAtTime(0,t0+d);

const _punct=s=>String(s||'').replace(/[.,!?;:“”"()]/g,'').replace(/\s+/g,' ').trim();
const _exact=s=>_punct(s).normalize('NFC').toLowerCase();
const _loose=s=>' '+wnorm(_punct(s))+' ';
function findClip(t){
  if(typeof AUD==='undefined'||!AUD.clips.length)return null;
  const pool=AUD.clips.filter(c=>c.text&&c.text.trim()),term=_exact(t),loose=_loose(t);
  let c=pool.find(x=>_exact(x.text)===term);                                   // whole sentence, same tone marks
  if(!c)c=pool.filter(x=>(' '+_exact(x.text)+' ').includes(' '+term+' '))      // contains the phrase, same tone marks
          .sort((a,b)=>a.text.length-b.text.length)[0];
  if(!c)c=pool.filter(x=>_loose(x.text).includes(loose))                       // contains it, ignoring tone marks
          .sort((a,b)=>a.text.length-b.text.length)[0];
  return c||null;
}
function speak(t){
  const c=findClip(t);
  if(c){playClip(c.id,.9);if(_exact(c.text)!==_exact(t))toast('Playing a recording that contains it: '+c.text);return true}
  const v=yoVoice();
  if(!v){toast('No recording or Yorùbá voice for this one yet.');return false}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=.8;speechSynthesis.speak(u);return true}catch(e){return false}
}

/* ---------- quiz building ---------- */
/* Multiple choice. Distractors are unique values so two options never read the same. */
function mcQ(it,dir,pool){
  const key=dir==='yo2en'?'en':'yo';
  const seen=new Set([it[key]]),others=[];
  for(const x of shuf(pool)){if(others.length>=3)break;if(!seen.has(x[key])){seen.add(x[key]);others.push(x[key])}}
  return{type:'mc',dir,item:it,prompt:dir==='yo2en'?it.yo:it.en,answer:it[key],options:shuf([it[key],...others])};
}
function buildQ(it){const toks=it.yo.split(' ');return{type:'build',item:it,prompt:it.en,answer:toks,bank:shuf(toks.map((t,i)=>({t,i})))}}
/* Reading passages: the questions come straight from the lesson data. */
function readQs(u){return u.read.qs.map(a=>({type:'mc',dir:'read',item:{yo:u.read.text,en:u.read.en,note:''},prompt:a[0],answer:a[1][a[2]],options:shuf(a[1])}))}
function makeQuiz(u){
  let qs;
  if(u.read)qs=readQs(u);
  else if(u.build){qs=shuf(u.items).map(buildQ).concat(shuf(u.items).slice(0,2).map(it=>mcQ(it,'yo2en',u.items)));qs=shuf(qs)}
  else if(u.oneway){qs=shuf(u.items).slice(0,8).map(it=>Object.assign(mcQ(it,'yo2en',u.items),{dir:'ask',label:u.ask}))}
  else{const pool=u.items.length>=4?u.items:ALL;
    const all=[];u.items.forEach(it=>{all.push(mcQ(it,'yo2en',pool));all.push(mcQ(it,'en2yo',pool))});
    qs=shuf(all).slice(0,Math.min(10,all.length))}
  qs.forEach(q=>q.tries=0);return qs;
}

function courseProg(c){

  const m={12:P.audioDone,20:P.calls+(P.chats||0),21:P.writes}[c.id]||0;return{done:m>0?1:0,total:1};
}

/* ===== 05-tones.js  Tone parser, Tone Lab page and Alphabet page ===== */

/* Reads the tone of each syllable from the marks: grave = Low (L), acute = High (H), no mark = Mid (M).
   Counts vowels and marked syllabic nasals (ń, ǹ). A repeated unmarked vowel (long vowel) copies the tone before it. */
function toneOf(word){
  const ch=[...String(word).normalize('NFD')],out=[],V='aeiou';let prevV=null;
  for(let i=0;i<ch.length;i++){
    const b=ch[i].toLowerCase();
    if(!V.includes(b)&&b!=='n'&&b!=='m'){prevV=null;continue}
    let j=i+1,mk='';while(j<ch.length&&/[̀-ͯ]/.test(ch[j])){mk+=ch[j];j++}
    const marked=/[̀́]/.test(mk),tone=mk.includes('̀')?'L':mk.includes('́')?'H':'M';
    if(b==='n'||b==='m'){
      const nx=(ch[j]||'').toLowerCase();
      if(marked&&!(nx&&V.includes(nx)))out.push(tone);
      prevV=null;i=j-1;continue;
    }
    if(prevV===b&&!marked&&out.length)out.push(out[out.length-1]);else out.push(tone);
    prevV=b;i=j-1;
  }
  return out.join('');
}
const toneNames=p=>[...p].map(k=>TONES[k].nm).join(', ');

function contour(t){
  const n=t.length,w=40*n+20;
  const pts=[...t].map((k,i)=>[30+i*40,TONES[k].y]);
  return `<svg viewBox="0 0 ${w} 90" role="img" aria-label="Pitch pattern ${toneNames(t)}">
    ${[18,45,72].map(y=>`<line x1="6" x2="${w-6}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`).join('')}
    <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--indigo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="var(--gold)" stroke="var(--indigo)" stroke-width="2"/>`).join('')}</svg>`;
}

function tones(){
  const T=S.tt;
  return `<div class="sec"><h2>Tone Lab</h2></div>
  <div class="panel"><p style="margin:0">Yorùbá has three tones. They change the meaning of a word, so “ọkọ” can mean husband, vehicle or hoe depending on pitch. Tap each to hear it. Teachers often link them to the notes <b>do, re, mi</b>.</p>
    <div class="tone3" style="margin-top:14px">${['L','M','H'].map(k=>`<button class="tbtn" data-act="tone" data-k="${k}"><span class="m">${TONES[k].mark}</span><span class="nm">${TONES[k].nm}</span><span class="s">${TONES[k].solf} · ${k==='M'?'no mark':k==='L'?'grave ` mark':'acute ´ mark'}</span></button>`).join('')}</div></div>
  <div class="sec"><h2>Same letters, new meaning</h2></div>
  <div class="pairs">${PAIRS.map(p=>`<button class="pair" data-act="word" data-t="${p.t}" aria-label="Play ${esc(p.w)}">
    <span class="w">${esc(p.w)}</span>${contour(p.t)}<span class="muted">${esc(p.en)}</span><span class="eyebrow" style="color:var(--indigo)">Play pitch</span></button>`).join('')}</div>
  <div class="sec"><h2>Ear test</h2><span class="meta">${T.score} of ${T.n} right</span></div>
  <div class="panel"><p style="margin:0 0 12px">${T.tone?'Which tone was it?':'Press play, then pick the tone you heard.'}</p>
    <div class="row" style="margin:0 0 14px;justify-content:flex-start"><button class="btn alt" data-act="ear">${T.tone?'Play again':'Play a tone'}</button></div>
    <div class="tone3">${['L','M','H'].map(k=>{let st='';if(T.shown){if(k===T.tone)st='border-color:var(--good);background:var(--good-bg)';else if(k===T.pick)st='border-color:var(--bad);background:var(--bad-bg)'}
      return `<button class="tbtn" style="${st}" data-act="guess" data-k="${k}" ${!T.tone||T.shown?'disabled':''}><span class="m">${TONES[k].mark}</span><span class="nm">${TONES[k].nm}</span></button>`}).join('')}</div>
    ${T.shown?`<div class="row"><button class="btn" data-act="earnext">Next tone</button></div>`:''}</div>
  <div class="panel cult"><h3>Want a game?</h3><p>Tone Tower plays a pitch pattern and you pick the word that matches. Every right answer adds a piece to your tower.</p><div class="row" style="justify-content:flex-start"><button class="btn" data-act="tab" data-v="tower">Play Tone Tower</button></div></div>
  <p class="fine">These are synthesized beeps that show pitch height, not a speaker’s voice. Real speech also glides between tones.</p>`;
}

  const sel=ALPHA.find(a=>a[0]===S.al)||ALPHA[0];

let SAMPLE;

const SCEN=[
 {id:'meet',lvl:'b',title:'Meet a new friend',name:'Ayọ̀',topics:'Greetings and introductions',who:'a friendly Yorùbá-speaking teenager who has just met the learner',goal:'greetings, names, how are you, thank you, goodbye'},

 {id:'grand',lvl:'b',title:'Call your grandmother',name:'Ìyá àgbà',topics:'Family and respect',who:'the learner’s warm, loving grandmother, who likes polite, respectful greetings',goal:'respectful greetings with Ẹ, family words, asking how she is, food'},

 {id:'debate',lvl:'a',title:'Share your opinion',name:'Fúnmi',topics:'Opinions and reasons',who:'a friend who loves a friendly debate about school, phones or music',goal:'giving opinions, agreeing and disagreeing, because, but and if sentences'}];
const LVL={b:'simple beginner',i:'intermediate (short connected sentences, everyday topics, tense markers like ń, ti and máa)',a:'more advanced (longer sentences, conjunctions, opinions and polite formal speech)'};
function rules(sc,mode){return `You are role-playing ${mode==='chat'?'a text chat':'a phone call'} so a teenage learner can practise Yorùbá. You are ${sc.name}, ${sc.who}. Practice goal: ${sc.goal}.
Rules:
- Speak ${LVL[sc.lvl||'b']} Yorùbá, one or two short sentences per turn, and keep the ${mode==='chat'?'chat':'call'} going with one easy question or prompt. Write your own Yorùbá with correct tone marks and underdots.
${mode==='call'?'- The learner is SPEAKING, and their words arrive as speech-recognition text, which is often wrong for Yorùbá. Do not mark odd spellings as mistakes; if a line looks garbled, set fb.status to "none" and kindly ask them to say it again.\n':''}- The learner may write Yorùbá, English, or a mix. Many learners type without tone marks or underdots. Never treat missing diacritics as a mistake. You may mention it once as a small tip.
- Check each learner message for real mistakes: a wrong word, word order, a wrong pronoun, or a tone mark that changes the meaning. Be kind and specific. If you are not sure a correction is right, say so in "why".
Reply every turn with ONLY one JSON object and no other text, in this shape:
{"yo":"your line in Yorùbá","en":"English translation of your line","hint":"2 to 6 English words nudging what the learner could say next","fb":{"status":"good or fix or english or none","said":"the learner's line exactly as written","better":"the best Yorùbá version, with tone marks","why":"one or two short, teen-friendly sentences"}}
fb.status values: "good" means their Yorùbá was correct (better is their line with tone marks added, why is a short compliment); "fix" means there is a mistake to correct; "english" means they wrote English, so better is the Yorùbá they could have said; "none" means there is no learner message yet.`}
function ratePrompt(c){
  const lines=c.msgs.map(m=>m.who==='them'?`${c.sc.name}: ${m.yo} (${m.en})`:`Learner: ${m.text}   [check: ${m.fb?m.fb.status+' | better: '+m.fb.better+' | '+m.fb.why:'none'}]`).join('\n');
  return `A teenage beginner just finished a Yorùbá practice ${c.mode==='chat'?'text chat':'phone call'} (${c.sc.title}). Here is the transcript with the check already made on each learner line:\n${lines}\n\nRate the learner's Yorùbá for a beginner. Be encouraging but honest. Do not penalise missing tone marks or underdots; mention them only as a tip. Reply with ONLY one JSON object and no other text, in this shape:\n{"stars":4,"score":78,"summary":"two short sentences","did_well":["up to 3 short items"],"work_on":[{"point":"short label","tip":"one sentence on how to fix it"}],"practice":[{"yo":"word or phrase","en":"meaning"}]}\nstars is a whole number 1 to 5, score is 0 to 100, work_on has up to 3 items, practice has up to 5 items.`;
}
const them=r=>({who:'them',yo:String(r.yo||''),en:String(r.en||'')});
function normFb(f){f=f||{};const st=['good','fix','english'].includes(f.status)?f.status:'none';
  return{status:st,said:String(f.said||''),better:String(f.better||''),why:String(f.why||'')}}
function cleanRating(r){r=r||{};const n=Math.max(1,Math.min(5,Math.round(Number(r.stars))||3));
  return{stars:n,score:Math.max(0,Math.min(100,Math.round(Number(r.score))||n*20)),summary:String(r.summary||''),
    did_well:(Array.isArray(r.did_well)?r.did_well:[]).slice(0,3).map(String),
    work_on:(Array.isArray(r.work_on)?r.work_on:[]).slice(0,3).map(w=>({point:String(w&&w.point||''),tip:String(w&&w.tip||'')})),
    practice:(Array.isArray(r.practice)?r.practice:[]).slice(0,5).map(w=>({yo:String(w&&w.yo||''),en:String(w&&w.en||'')}))}}
function sampleErr(e){const m={not_granted:'Claude is not allowed for this page. Allow it when asked, then try again.',sampling_disabled:'Claude is not available on this account.',rate_limited:'Too many requests at once. Wait a moment, then try again.',session_expired:'Please sign in again, then retry.',refused:'That message could not be answered. Try saying it a different way.',invalid_json:'The reply came back garbled. Send it again.'};return m[e&&e.code]||'Something went wrong reaching Claude. Try again.'}
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let ringI,tmrI;
function ringOnce(){try{const c=ctx();const t=c.currentTime+.02;[0,.45].forEach(o=>{beep(440,t+o,.3);beep(480,t+o,.3)})}catch(e){}}
function stopRing(){clearInterval(ringI);ringI=null}
function startTimer(){clearInterval(tmrI);tmrI=setInterval(()=>{const el=$('#timer');if(el&&S.call&&S.call.start)el.textContent=fmt(Date.now()-S.call.start)},1000)}
function autoSay(t){const c=S.call;if(c&&c.auto&&yoVoice())speak(t)}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* Can this page really make a spoken call? Needs speech recognition and a microphone it is allowed to open. */
async function micCheck(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return{ok:false,why:'this browser cannot turn speech into text'};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return{ok:false,why:'this page cannot reach a microphone'};
  try{
    const st=await Promise.race([navigator.mediaDevices.getUserMedia({audio:true}),sleep(15000).then(()=>{throw new Error('timeout')})]);
    st.getTracks().forEach(t=>t.stop());return{ok:true};
  }catch(e){return{ok:false,why:'the microphone is blocked or missing here'}}
}
function bounceHome(why){stopRing();S.call=null;toast(`The call could not connect: ${why}. Taking you home. Try Chat to practise by typing.`);go('home')}

/* mode: 'chat' (typed) or 'call' (spoken) */
async function startConvo(id,mode){
  if(!SAMPLE){if(mode==='call'){bounceHome('Claude is not available in this view')}else toast('Chat needs Claude, which is not available in this view.');return}
  const sc=SCEN.find(s=>s.id===id),t0=Date.now();
  const opener=mode==='chat'?'The learner opened the chat. Start it: greet them in character.':'The phone rang and the learner answered. Start the call: greet them in character.';
  const c=S.call={mode,phase:'ring',sc,msgs:[],busy:true,draft:'',hint:'',showHint:false,showEn:true,auto:true,start:0,err:'',typed:false,listening:false,lang:0,
    turns:[{role:'user',content:rules(sc,mode)+'\n\n'+opener+' Set fb.status to "none" and the other fb fields to empty strings.'}]};
  S.callErr='';render();
  if(mode==='call'){
    ringOnce();ringI=setInterval(ringOnce,2200);
    const m=await micCheck();
    if(S.call!==c)return;
    await sleep(Math.max(0,2300-(Date.now()-t0)));            // let it ring at least once
    if(S.call!==c)return;
    if(!m.ok){bounceHome(m.why);return}
  }
  try{
    const r=await SAMPLE.json(c.turns,{cache:false});
    if(S.call!==c||c.phase!=='ring')return;
    stopRing();c.turns.push({role:'assistant',content:JSON.stringify(r)});
    c.msgs.push(them(r));c.hint=String(r.hint||'');c.phase='live';c.busy=false;c.start=Date.now();c.scroll=true;c.focus=mode==='chat';
    startTimer();render();autoSay(r.yo);
  }catch(e){
    if(S.call!==c)return;
    stopRing();S.call=null;S.callErr=sampleErr(e);render();
  }
}

/* Spoken turn: listen once, then send what was heard as the learner's line. */
const CLANGS=['yo-NG','yo'];
function talk(){
  const c=S.call;if(!c||c.mode!=='call'||c.busy||c.listening||c.phase!=='live')return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){c.err='Speech recognition is not available.';render();return}
  try{speechSynthesis.cancel()}catch(e){}
  c.listening=true;c.err='';c.heard='';render();
  let done=false;const fin=r=>{if(done)return;done=true;c.listening=false;
    if(S.call!==c)return;
    if(r.text){c.draft=r.text;render();sendMsg();return}
    if(r.err==='language-not-supported'&&c.lang<CLANGS.length-1){c.lang++;render();talk();return}
    c.err=r.err==='no-speech'||!r.err?'I did not hear anything. Tap the microphone and try again.':r.err==='not-allowed'||r.err==='service-not-allowed'?'The microphone is blocked. Use “Type instead”, or end the call.':'Speech recognition had a problem ('+r.err+'). Try again, or use “Type instead”.';
    render()};
  try{
    const rec=new SR();rec.lang=CLANGS[c.lang]||'yo-NG';rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;
    rec.onresult=e=>fin({text:(e.results[0][0]&&e.results[0][0].transcript||'').trim()});
    rec.onerror=e=>fin({err:e.error});rec.onend=()=>fin({});
    rec.start();setTimeout(()=>{if(!done)try{rec.stop()}catch(e){}},9000);
  }catch(e){fin({err:'start-failed'})}
}
async function sendMsg(){
  const c=S.call;if(!c||c.busy||c.phase!=='live')return;
  const text=(c.draft||'').trim();if(!text)return;
  c.draft='';c.showHint=false;c.busy=true;c.err='';
  const me={who:'me',text};c.msgs.push(me);c.turns.push({role:'user',content:'Learner: '+text});
  c.scroll=true;c.focus=true;render();
  try{
    const r=await SAMPLE.json(c.turns,{cache:false});
    if(S.call!==c||c.phase!=='live')return;
    c.turns.push({role:'assistant',content:JSON.stringify(r)});
    me.fb=normFb(r.fb);c.msgs.push(them(r));c.hint=String(r.hint||'');c.busy=false;c.scroll=true;c.focus=true;
    render();autoSay(r.yo);
  }catch(e){
    if(S.call!==c||c.phase!=='live')return;
    c.msgs.pop();c.turns.pop();c.draft=text;c.err=sampleErr(e);c.busy=false;c.focus=true;render();
  }
}
function endCall(){
  const c=S.call;if(!c||c.phase!=='live')return;
  clearInterval(tmrI);try{speechSynthesis.cancel()}catch(e){}
  c.dur=Date.now()-c.start;c.phase='rate';c.rating=null;c.rerr='';
  if(!c.msgs.some(m=>m.who==='me')){c.empty=true;render();return}
  render();rateCall(c);
}
async function rateCall(c){
  try{
    const r=await SAMPLE.json(ratePrompt(c),{cache:false});
    if(S.call!==c)return;
    c.rating=cleanRating(r);
    if(!c.awarded){c.awarded=true;if(c.mode==='chat')P.chats=(P.chats||0)+1;else P.calls=(P.calls||0)+1;addXP(20)}
  }catch(e){if(S.call!==c)return;c.rerr=sampleErr(e)}
  render();
}

const stars=n=>`<div class="stars" role="img" aria-label="${n} out of 5 stars">${[1,2,3,4,5].map(i=>`<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2.5 15,9 22,9.8 16.8,14.5 18.3,21.5 12,18 5.7,21.5 7.2,14.5 2,9.8 9,9" fill="${i<=n?'var(--gold)':'none'}" stroke="${i<=n?'var(--gold)':'var(--line)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`).join('')}</div>`;
function fbHtml(fb){
  if(!fb||fb.status==='none')return '';
  if(fb.status==='good')return `<div class="fbw"><div class="fb ok"><b>Looks right</b><span>${fb.better&&fb.better!==fb.said?`With marks: <span class="yo">${esc(fb.better)}</span>. `:''}${esc(fb.why)}</span></div></div>`;
  if(fb.status==='english')return `<div class="fbw"><div class="fb tip"><b>In Yorùbá</b><span><span class="yo">${esc(fb.better)}</span> ${esc(fb.why)}</span></div></div>`;
  return `<div class="fbw"><div class="fb no"><b>Try this instead</b><span><span class="said">${esc(fb.said)}</span> → <span class="yo">${esc(fb.better)}</span><br>${esc(fb.why)}</span></div></div>`;
}
const init=sc=>esc([...sc.name.replace(/^Ìyá /,'')][0]||'?');

function convoView(mode){
  const c=S.call&&S.call.mode===mode?S.call:null,chat=mode==='chat',w=chat?'chat':'call';
  if(!c){
    return `<div class="sec" style="padding-top:max(14px,env(safe-area-inset-top,0px))"><h2>${chat?'Chat':'Phone call'}</h2></div>
    <div class="panel"><p style="margin:0">${chat?'Text with a Yorùbá speaker. Type in Yorùbá, English, or a mix. Every message you send gets a quick check with the fix, and when you finish you get a rating and what to work on.'
      :'Ring a Yorùbá speaker and talk out loud. Your voice is turned into text by your browser, checked, and answered. When you hang up, you get a rating and what to work on.'}</p>
      <p class="muted" style="margin:10px 0 0;font-size:.9rem">${chat?'':'Calls need a microphone and speech recognition. If this device or page cannot use them, the call fails and takes you back Home. '}The partner and the feedback come from Claude, which can make mistakes, especially with tone marks. Check anything important with a Yorùbá speaker.</p>
      <div class="row" style="justify-content:flex-start"><button class="btn alt" data-act="tab" data-v="${chat?'call':'chat'}">${chat?'Try a phone call instead':'Prefer typing? Open Chat'}</button></div></div>
    ${S.callErr?`<div class="fb no" style="margin-top:14px">${esc(S.callErr)}</div>`:''}
    ${SAMPLE===null?`<div class="fb no" style="margin-top:14px">This needs Claude, which is not available where you opened this page.</div>`:''}
    <div class="units" style="margin-top:14px">${SCEN.map(s=>`<button class="unit" data-act="startconvo" data-m="${mode}" data-id="${s.id}">
      <span class="n">${ic(chat?'chat':'call')}</span>
      <h3>${esc(s.title)}</h3><span class="yoname">${esc(s.name)} · ${{b:'Beginner',i:'Intermediate',a:'Advanced'}[s.lvl]}</span><span class="meta">${esc(s.topics)}</span></button>`).join('')}</div>`;
  }
  if(c.phase==='ring'){
    return `<div class="callscr"><div class="av${chat?'':' ring'}">${init(c.sc)}</div><h2>${esc(c.sc.name)}</h2><div class="muted">${chat?'Opening chat…':'Calling…'}</div>
      <div class="row"><button class="end" data-act="cancelcall">Cancel</button></div></div>`;
  }
  if(c.phase==='rate'){
    const W=w[0].toUpperCase()+w.slice(1);
    if(c.empty)return `<div class="panel cen"><h2>${W} ended</h2><p class="muted">You finished before saying anything, so there is nothing to rate yet.</p>
      <div class="row"><button class="btn" data-act="callagain">Back</button></div></div>`;
    if(c.rerr)return `<div class="panel cen"><h2>Could not score the ${w}</h2><p class="muted">${esc(c.rerr)}</p><div class="row"><button class="btn" data-act="rerate">Try again</button><button class="btn alt" data-act="callagain">Back</button></div></div>`;
    if(!c.rating)return `<div class="panel cen"><h2>${W} ended</h2><p class="muted" style="margin:6px 0 0">Scoring… this can take up to a minute.</p></div>`;
    const r=c.rating,fixes=c.msgs.filter(m=>m.who==='me'&&m.fb&&(m.fb.status==='fix'||m.fb.status==='english'));
    return `<div class="panel cen"><div class="eyebrow muted">${W} with ${esc(c.sc.name)} · ${fmt(c.dur)}</div>
      ${stars(r.stars)}<div class="big" style="font-family:var(--f-ui);font-weight:800">${r.score}<span class="muted" style="font-size:.4em;font-weight:600"> / 100</span></div>
      <p style="margin:10px auto 0;max-width:46ch">${esc(r.summary)}</p>
      ${r.did_well.length?`<div class="rsec"><div class="q-label">What went well</div><ul class="l">${r.did_well.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${r.work_on.length?`<div class="rsec"><div class="q-label">What to work on</div><ul class="l">${r.work_on.map(w=>`<li><b>${esc(w.point)}.</b> ${esc(w.tip)}</li>`).join('')}</ul></div>`:''}
      ${fixes.length?`<div class="rsec"><div class="q-label">Fixes from this ${w}</div><ul class="l">${fixes.map(m=>`<li>${esc(m.text)} → <span class="yo">${esc(m.fb.better)}</span></li>`).join('')}</ul></div>`:''}
      ${r.practice.length?`<div class="rsec"><div class="q-label">Words to practise</div><div class="chips">${r.practice.map(p=>`<span class="chip"><span class="yo">${esc(p.yo)}</span> · ${esc(p.en)}</span>`).join('')}</div></div>`:''}
      <p class="fine" style="text-align:center">+20 XP. Ratings come from Claude and are a guide, not a grade.</p>
      <div class="row"><button class="btn alt" data-act="callagain">Another ${w}</button><button class="btn" data-act="tab" data-v="courses">Courses</button></div></div>`;
  }
  const last=c.msgs[c.msgs.length-1],typing=chat||c.typed;
  return `<div class="callhead"><div class="av sm">${init(c.sc)}</div>
      <div class="who"><h2>${esc(c.sc.name)}</h2><div class="meta">${c.busy?'Typing…':chat?'Online':'On call'} · <span id="timer">${fmt(Date.now()-c.start)}</span></div></div>
      <button class="end" data-act="endcall" aria-label="End ${w}">${chat?'Finish':'End call'}</button></div>
    <div class="thread" aria-live="polite">${c.msgs.map(m=>m.who==='them'
      ?`<div class="msg them"><div class="bub"><div class="cyo yo">${esc(m.yo)}</div>${c.showEn?`<div class="cen2">${esc(m.en)}</div>`:''}</div>${spkBtn(m.yo)}</div>`
      :`<div class="msg me"><div class="bub">${esc(m.text)}</div></div>${m.fb?fbHtml(m.fb):(c===S.call&&c.busy&&m===last?'<div class="fbw meta">Checking…</div>':'')}`).join('')}</div>
    <div class="dock">
      ${c.err?`<div class="fb no" style="margin:0">${esc(c.err)}</div>`:''}
      ${c.showHint&&c.hint?`<div class="note">Try saying: ${esc(c.hint)}</div>`:''}
      ${typing?`<div class="keys" aria-label="Special letters">${['ẹ','ọ','ṣ','à','á','è','é','ì','í','ò','ó','ù','ú'].map(k=>`<button class="key" data-act="ins" data-c="${k}">${k}</button>`).join('')}</div>
      <div class="say"><input id="say" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" placeholder="Reply in Yorùbá or English" aria-label="Your reply"><button class="btn" data-act="send" ${c.busy?'disabled':''}>Send</button></div>`
      :`<div style="text-align:center">${c.listening?`<div class="listening" role="status"><span></span><span></span><span></span></div><p class="meta" style="margin:6px 0 0">Listening… speak now</p>`:`<button class="btn mic" data-act="talk" ${c.busy?'disabled':''}>🎤 ${c.busy?'Wait for the reply…':'Tap to talk'}</button>`}</div>`}
      <div class="tools"><button class="chip" data-act="hint">Hint</button><button class="chip" data-act="toggleen">English: ${c.showEn?'on':'off'}</button>${chat?'':`<button class="chip${c.typed?' on':''}" data-act="toggletyped">Type instead</button>`}${yoVoice()?`<button class="chip" data-act="toggleaud">Read aloud: ${c.auto?'on':'off'}</button>`:''}</div>
    </div>`;
}

  el.setRangeText(d.c,s,e2,'end');if(S.call)S.call.draft=el.value;el.focus()};
AFTER.chat=AFTER.call=()=>{
  if(S.call&&S.call.phase==='live'){
    const el=$('#say');
    if(el){el.value=S.call.draft||'';if(S.call.focus){el.focus({preventScroll:true});S.call.focus=false}}
    if(S.call.scroll){S.call.scroll=false;requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight}))}
  }
};
document.addEventListener('input',e=>{if(e.target.id==='say'&&S.call)S.call.draft=e.target.value});

/* ===== 07-words.js  Phrasebook (searchable, filter by course) and Culture page ===== */
const HANDY=[
 ['Ebi ń pa mí','I am hungry',''],['Òùngbẹ ń gbẹ mí','I am thirsty',''],['Oorun ń gbé mi','I am sleepy',''],['Inú mi dùn','I am happy','Literally “my inside is sweet.”'],
 ['Mo gbọ́','I understand / I hear',''],['Mi ò gbọ́','I do not understand',''],['Mi ò mọ̀','I do not know',''],['Jọ̀wọ́, tún un sọ','Please say it again',''],
 ['Ó dára','It is good / okay',''],['Ṣé o gbọ́ Yorùbá?','Do you understand Yorùbá?',''],['Mo fẹ́ràn èdè Yorùbá','I like the Yorùbá language','']
].map(a=>({yo:a[0],en:a[1],note:a[2],unit:'handy'}));

function wordList(){
  const W=S.ws,pool=uniqBy([...ALL,...HANDY],i=>i.yo+'|'+i.en).filter(i=>{
    if(W.cat==='all')return true;if(W.cat==='handy')return i.unit==='handy';
    const u=unit(i.unit);return u&&u.course===+W.cat});
  const q=wnorm(W.q.trim()),out=q?pool.filter(i=>wnorm(i.yo).includes(q)||wnorm(i.en).includes(q)):pool;
  return out.length?out.slice(0,200).map(i=>`<div class="wrow"><div style="min-width:0"><div class="yo wy">${esc(i.yo)}</div><div class="muted">${esc(i.en)}</div></div>${spkBtn(i.yo)}</div>`).join('')+(out.length>200?'<p class="fine">Showing the first 200. Type to narrow it down.</p>':'')
    :'<p class="muted">No match. Try another spelling or an English word.</p>';
}
function words(){
  const W=S.ws||(S.ws={q:'',cat:'all'});
  const total=uniqBy([...ALL,...HANDY],i=>i.yo+'|'+i.en).length;
  return `<div class="sec" style="padding-top:max(14px,env(safe-area-inset-top,0px))"><h2>Phrasebook</h2><span class="meta">${total} entries</span></div>

}
document.addEventListener('input',e=>{if(e.target.id==='wsq'&&S.ws){S.ws.q=e.target.value;const l=$('#wsl');if(l)l.innerHTML=wordList()}});

/* ===== 08-audiolab.js  Audio Lab (Course 12)
   - Import real recordings (for example from OpenSLR SLR86) into this browser's IndexedDB.
   - Drills: hear a clip and pick its transcript, or hear it and type it.
   - Word listening with the device's Yorùbá voice, when the device has one.
   Clips never leave the browser. WebAudio decodes them, so no hosting or media permissions are needed. ===== */

const AUD={db:null,clips:[],cache:new Map(),src:null,busy:false,msg:'',err:'',loaded:false,confirmDel:false};
const MAX_CLIPS=2000,MAX_SEC=25;


/* ---------- IndexedDB (one store: clips {id,name,text,data,dur,size}) ---------- */
function idb(){return new Promise((res,rej)=>{
  if(AUD.db)return res(AUD.db);let r;
  try{r=indexedDB.open('ede-mi-audio',1)}catch(e){return rej(e)}
  r.onupgradeneeded=()=>{r.result.createObjectStore('clips',{keyPath:'id'})};
  r.onsuccess=()=>{AUD.db=r.result;res(AUD.db)};r.onerror=()=>rej(r.error)})}
const idbTx=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction('clips',mode),out=fn(t.objectStore('clips'));
  t.oncomplete=()=>res(out&&'result' in out?out.result:undefined);t.onerror=t.onabort=()=>rej(t.error)}));
async function loadClips(){
  try{AUD.clips=(await idbTx('readonly',st=>st.getAll()))||[];AUD.err=''}
  catch(e){AUD.clips=[];AUD.err='This browser would not let the page keep audio files, so importing is off here.'}
  AUD.loaded=true;if(S.view==='audio')render();
}
const labeled=()=>AUD.clips.filter(c=>c.text&&c.text.trim());
const totalMB=()=>AUD.clips.reduce((a,c)=>a+(c.size||0),0)/1048576;

/* ---------- transcript parsing ---------- */
const stemOf=n=>String(n).split(/[\\/]/).pop().replace(/\.[^.]+$/,'').trim().toLowerCase();
/* Accepts clips.json ([{file,text}] or {stem:text}) and OpenSLR tab-separated line_index files (first column = id, last = sentence). */
function parseTranscripts(txt,name){
  const m=new Map(),clean=t=>String(t||'').normalize('NFC').replace(/\s+/g,' ').trim();
  if(/\.json$/i.test(name)){
    let j;try{j=JSON.parse(txt)}catch(e){return m}
    if(Array.isArray(j))j.forEach(o=>{if(o&&typeof o==='object'){const f=o.file||o.id||o.name,t=o.text||o.transcript||o.sentence;if(f&&t)m.set(stemOf(f),clean(t))}});
    else if(j&&typeof j==='object')Object.keys(j).forEach(k=>{if(typeof j[k]==='string')m.set(stemOf(k),clean(j[k]))});
    return m;
  }
  txt.split(/\r?\n/).forEach(line=>{const c=line.split('\t');if(c.length>=2){const t=clean(c[c.length-1]);if(c[0].trim()&&t)m.set(stemOf(c[0]),t)}});
  return m;
}
const isAudioFile=f=>/^audio\//.test(f.type)||/\.(wav|mp3|ogg|oga|flac|m4a|aac|webm)$/i.test(f.name);
const isTextFile=f=>/\.(json|tsv|txt|csv)$/i.test(f.name);

/* ---------- importing ---------- */
async function importFiles(files){
  const list=[...files];if(!list.length||AUD.busy)return;
  AUD.busy=true;AUD.err='';AUD.msg='Reading transcripts…';render();
  let added=0,skipped=0,attached=0;
  try{
    const tr=new Map();
    for(const f of list.filter(isTextFile)){parseTranscripts(await f.text(),f.name).forEach((v,k)=>tr.set(k,v))}
    /* A transcript file on its own adds sentences to clips already imported. */
    if(tr.size){for(const c of AUD.clips){if(!c.text&&tr.has(c.id)){c.text=tr.get(c.id);await idbTx('readwrite',st=>st.put(c));attached++}}}
    const audio=list.filter(isAudioFile);
    for(let i=0;i<audio.length;i++){
      if(AUD.clips.length>=MAX_CLIPS){skipped+=audio.length-i;break}
      const f=audio[i];AUD.msg=`Adding clip ${i+1} of ${audio.length}…`;render();
      try{
        const data=await f.arrayBuffer(),buf=await ctx().decodeAudioData(data.slice(0));
        if(buf.duration>MAX_SEC){skipped++;continue}
        const id=stemOf(f.name),clip={id,name:f.name,text:tr.get(id)||'',data,dur:buf.duration,size:data.byteLength};
        await idbTx('readwrite',st=>st.put(clip));
        const k=AUD.clips.findIndex(c=>c.id===id);if(k>=0)AUD.clips[k]=clip;else AUD.clips.push(clip);
        AUD.cache.set(id,buf);added++;
      }catch(e){skipped++}
    }
    AUD.msg=`Added ${added} clip${added===1?'':'s'}${attached?`, attached ${attached} transcript${attached===1?'':'s'}`:''}${skipped?`, skipped ${skipped} (too long, unreadable or over the ${MAX_CLIPS}-clip limit)`:''}.${tr.size===0&&audio.length?' No transcript file was included, so these clips cannot be used in drills until you add one.':''}`;
  }catch(e){AUD.err='Something went wrong reading those files. Try fewer files at a time.';AUD.msg=''}
  AUD.busy=false;render();
}
async function clearClips(){
  try{await idbTx('readwrite',st=>st.clear())}catch(e){}
  AUD.clips=[];AUD.cache.clear();AUD.msg='All clips removed.';AUD.confirmDel=false;S.au=null;render();
}

/* ---------- playback ---------- */
async function bufFor(c){
  if(AUD.cache.has(c.id))return AUD.cache.get(c.id);
  const b=await ctx().decodeAudioData(c.data.slice(0));AUD.cache.set(c.id,b);
  if(AUD.cache.size>40)AUD.cache.delete(AUD.cache.keys().next().value);return b;
}
async function playClip(id,rate){
  const c=AUD.clips.find(x=>x.id===id);if(!c)return;
  try{
    const b=await bufFor(c),cx=ctx();
    try{if(AUD.src)AUD.src.stop()}catch(e){}
    const s=cx.createBufferSource();s.buffer=b;s.playbackRate.value=rate||1;s.connect(cx.destination);s.start();AUD.src=s;
  }catch(e){toast('That clip could not be played.')}
}
const clipBtn=(id,label)=>`<button class="btn alt" data-act="playclip" data-id="${esc(id)}">▶ ${label||'Play'}</button>`;

/* ---------- clip drills ---------- */
function auNew(mode){
  const pool=labeled();
  if(pool.length<4){toast('Import at least 4 clips with transcripts first.');return}
  S.au={mode,n:0,rounds:5,score:0,q:null,pick:null,typed:'',res:null,done:false,slow:false};auNext();
}
function auNext(){
  const A=S.au,pool=labeled();
  const c=pool[Math.floor(Math.random()*pool.length)];
  const others=shuf(uniqBy(pool.filter(x=>x.text!==c.text),x=>x.text)).slice(0,3).map(x=>x.text);
  A.q={c,opts:shuf([c.text,...others])};A.pick=null;A.typed='';A.res=null;
  playClip(c.id,A.slow?.8:1);
}
/* Compare typed words to the sentence. Exact match scores 1, right letters but wrong marks scores 0.5. */
function dictScore(target,typed){
  const strip=w=>w.replace(/[.,!?;:“”"()]/g,''),T=target.split(/\s+/).map(strip).filter(Boolean),U=typed.split(/\s+/).map(strip).filter(Boolean);
  const used=new Array(U.length).fill(false),marks=[];let pts=0;
  const out=T.map(w=>{
    let k=U.findIndex((u,i)=>!used[i]&&u.normalize('NFC')===w.normalize('NFC'));
    if(k>=0){used[k]=true;pts+=1;return{w,st:'ok'}}
    k=U.findIndex((u,i)=>!used[i]&&wnorm(u)===wnorm(w));
    if(k>=0){used[k]=true;pts+=.5;return{w,st:'marks'}}
    return{w,st:'miss'}});
  return{pct:T.length?Math.round(pts/T.length*100):0,words:out};
}
function auFinish(){
  const A=S.au;A.done=true;const xp=8+Math.round(A.score/A.rounds*8);
  P.audioDone++;addXP(xp);A.xp=xp;sfx('win');render();
}

function clipPanel(){
  const A=S.au,n=AUD.clips.length,lab=labeled().length;
  if(AUD.err&&!n)return `<div class="fb no" style="margin-top:0">${esc(AUD.err)}</div>`;
  if(!n)return `<p style="margin:0">No recordings have been added yet. Real voices are the best way to train your ear, and you can add your own set from OpenSLR (steps below). Everything stays in this browser.</p>`;
  const credit=`<p class="fine" style="margin-top:14px">Recordings: Open-source Yorùbá speech corpus (OpenSLR SLR86), Copyright Google, Inc., licensed CC BY-SA 4.0 (<a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">license</a>). Gutkin, Demirşahin, Kjartansson, Rivera and Túbọ̀sún, “Developing an Open-Source Corpus of Yoruba Speech,” Interspeech 2020, pp. 404–408. Clips are used as imported, without changes other than your selection. If you imported other recordings, credit their source.</p>`;
  let drill='';
  if(!A){
    drill=lab>=4?`<div class="row" style="justify-content:flex-start"><button class="btn" data-act="aunew" data-m="pick">Hear and pick</button><button class="btn alt" data-act="aunew" data-m="type">Hear and type</button></div>`
      :`<div class="note">${lab} of your ${n} clips ha${lab===1?'s':'ve'} a transcript. Add at least 4 with transcripts to unlock the drills. Import the transcript file (clips.json or line_index tsv) now to attach sentences to clips already added.</div>`;
  }else if(A.done){
    drill=`<div class="cen"><div class="big yo" style="margin:6px 0">Ó dára!</div><p class="muted" style="margin:0">Round done. ${A.mode==='pick'?`${A.score} of ${A.rounds} right.`:`Average accuracy ${Math.round(A.score/A.rounds*100)}%.`} +${A.xp} XP.</p>
      <div class="row"><button class="btn" data-act="aunew" data-m="${A.mode}">Another round</button><button class="btn alt" data-act="auquit">Done</button></div></div>`;
  }else{
    const q=A.q,head=`<div class="row" style="margin:0 0 12px;justify-content:space-between;align-items:center"><span class="meta">Clip ${A.n+1} of ${A.rounds}</span><span class="row" style="margin:0">${clipBtn(q.c.id,'Play again')}<button class="chip${A.slow?' on':''}" data-act="auslow">Slow</button></span></div>`;
    if(A.mode==='pick'){
      drill=head+`<div class="q-label" style="margin-top:0">What did you hear?</div><div class="opts" style="margin-top:8px">${q.opts.map(o=>{let cl='opt yo';if(A.pick!==null){if(o===q.c.text)cl+=' right';else if(o===A.pick)cl+=' wrong'}
        return `<button class="${cl}" data-act="aupick" data-v="${esc(o)}" ${A.pick!==null?'disabled':''}>${esc(o)}</button>`}).join('')}</div>
        ${A.pick!==null?`<div class="row"><button class="btn" data-act="aunext">${A.n+1>=A.rounds?'Finish':'Next clip'}</button></div>`:''}`;
    }else{
      drill=head+`<div class="q-label" style="margin-top:0">Type what you heard</div>
        <div class="say"><input id="audtype" class="search" type="text" autocomplete="off" autocapitalize="off" placeholder="Type the sentence (marks help, but are not required)" aria-label="Type what you heard" ${A.res?'disabled':''}><button class="btn" data-act="aucheck" ${A.res?'disabled':''}>Check</button></div>
        <div class="keys" style="margin-top:8px" aria-label="Special letters">${['ẹ','ọ','ṣ','à','á','è','é','ì','í','ò','ó','ù','ú'].map(k=>`<button class="key" data-act="auins" data-c="${k}">${k}</button>`).join('')}</div>
        ${A.res?`<div class="fb ${A.res.pct>=80?'ok':'no'}"><b>${A.res.pct}% matched</b><span>${A.res.words.map(w=>`<span class="yo" style="margin-right:6px;${w.st==='ok'?'color:var(--good)':w.st==='marks'?'color:var(--gold)':'color:var(--bad);text-decoration:underline'}">${esc(w.w)}</span>`).join('')}<br><span class="meta">Green is exact, gold has the right letters but different marks, red is missed or different.</span></span></div>
        <div class="row"><button class="btn" data-act="aunext">${A.n+1>=A.rounds?'Finish':'Next clip'}</button></div>`:''}`;
    }
  }
  return `<div class="meta" style="margin-bottom:10px">${n} clip${n===1?'':'s'} · ${lab} with transcripts · ${totalMB().toFixed(1)} MB in this browser</div>${drill}${credit}`;
}

/* ---------- word listening (device voice) ---------- */
function lsNew(){
  const pool=ALL.filter(i=>!unit(i.unit).build&&i.yo.split(' ').length<=3);
  const it=pool[Math.floor(Math.random()*pool.length)];
  const others=shuf(uniqBy(pool.filter(x=>x.en!==it.en),x=>x.en)).slice(0,3).map(x=>x.en);
  S.ls.q={it,opts:shuf([it.en,...others])};S.ls.pick=null;speak(it.yo);
}
function wordListen(){
  const v=yoVoice(),L=S.ls||(S.ls={n:0,score:0,q:null,pick:null});
  if(!v)return `<div class="note">This device has no Yorùbá voice installed, so word-by-word listening is not available here. Try a phone or computer that has one (look in its text-to-speech or language settings). Imported recordings, the Tone Lab and Tone Tower work on any device.</div>`;
  if(!L.q)return `<div class="row" style="margin-top:0;justify-content:flex-start"><button class="btn" data-act="lsnew">Play a word</button></div><p class="meta" style="margin:10px 0 0">Using the voice on this device: ${esc(v.name)}.</p>`;
  const q=L.q;
  return `<div class="row" style="margin:0 0 12px;justify-content:flex-start;align-items:center">${spkBtn(q.it.yo)}<span class="muted">Tap to hear it again · ${L.score} of ${L.n} right</span></div>
  <div class="opts" style="margin-top:0">${q.opts.map(o=>{let cl='opt';if(L.pick){if(o===q.it.en)cl+=' right';else if(o===L.pick)cl+=' wrong'}
    return `<button class="${cl}" data-act="lspick" data-v="${esc(o)}" ${L.pick?'disabled':''}>${esc(o)}</button>`}).join('')}</div>
  ${L.pick?`<div class="fb ${L.pick===q.it.en?'ok':'no'}"><b>${L.pick===q.it.en?'Correct':'Not quite'}</b><span><span class="yo">${esc(q.it.yo)}</span> means “${esc(q.it.en)}”.</span></div><div class="row"><button class="btn" data-act="lsnew">Next word</button></div>`:''}`;
}

/* ---------- page ---------- */
function audio(){
  const n=AUD.clips.length;
  return `<div class="sec" style="padding-top:max(14px,env(safe-area-inset-top,0px))"><h2>Audio Lab</h2><span class="meta">Course 12 · ${P.audioDone} round${P.audioDone===1?'':'s'} done</span></div>
  <div class="panel" style="margin-top:0"><h3>Real recordings</h3><div style="margin-top:10px">${clipPanel()}</div></div>
  <div class="panel"><h3>Add recordings</h3>
    <p class="muted" style="margin:8px 0 12px">Choose audio files (wav, mp3, ogg) and a transcript file together. Transcripts can be a clips.json file or an OpenSLR <span class="yo" style="font-weight:600">line_index</span> tsv. Up to ${MAX_CLIPS} clips of ${MAX_SEC} seconds or less.</p>
    ${AUD.err&&n?`<div class="fb no" style="margin:0 0 10px">${esc(AUD.err)}</div>`:''}
    <label class="btn filebtn${AUD.busy?' disabled':''}" for="audfiles">${AUD.busy?esc(AUD.msg||'Working…'):'Choose files'}</label>
    <input id="audfiles" type="file" multiple accept="audio/*,.wav,.mp3,.ogg,.flac,.m4a,.json,.tsv,.txt,.csv" ${AUD.busy?'disabled':''} hidden>
    ${AUD.msg&&!AUD.busy?`<p class="meta" style="margin:12px 0 0" role="status">${esc(AUD.msg)}</p>`:''}
    ${n?(AUD.confirmDel?`<div class="row" style="justify-content:flex-start"><span class="meta">Remove all ${n} clips from this browser?</span><button class="btn alt" data-act="audelyes">Yes, remove</button><button class="btn alt" data-act="audelno">Keep</button></div>`:`<div class="row" style="justify-content:flex-start"><button class="chip" data-act="audelask">Remove all clips</button></div>`):''}</div>
  <div class="panel"><h3>Word listening</h3><p class="muted" style="margin:8px 0 12px">Hear a word read by your device, then pick its meaning.</p>${wordListen()}</div>
  <div class="panel cult"><h3>More ear training</h3><p>Pitch practice works on every device.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn alt" data-act="tab" data-v="tones">Tone Lab</button><button class="btn alt" data-act="tab" data-v="tower">Tone Tower game</button></div></div>
  <details class="panel cult"><summary><b>How to get OpenSLR Yorùbá clips</b></summary>
    <ol class="l"><li>Download one or both zips and the line_index files from <a href="https://www.openslr.org/86/" target="_blank" rel="noopener">openslr.org/86</a> (about 450 MB each).</li>
    <li>On your computer, run the helper script that comes with this project: <code>python3 tools/prepare_openslr.py --zip yo_ng_female.zip --tsv line_index_female.tsv --out clips --count 150</code></li>
    <li>It picks short, clean sentences and writes a <b>clips</b> folder with the audio files and <b>clips.json</b>.</li>
    <li>Come back here, tap Choose files, and select everything in that folder.</li></ol>
    <p class="muted">The helper adds the license credit for you. Keep the credit when you share clips.</p></details>`;
}

ACT.audioopen=()=>go('audio');
ACT.playclip=d=>playClip(d.id,S.au&&S.au.slow?.8:1);
ACT.aunew=d=>{auNew(d.m);render()};
ACT.auquit=()=>{S.au=null;render()};
ACT.auslow=()=>{if(S.au){S.au.slow=!S.au.slow;render()}};
ACT.aupick=d=>{const A=S.au;if(!A||A.pick!==null)return;A.pick=d.v;const ok=d.v===A.q.c.text;if(ok)A.score++;sfx(ok?'ok':'bad');render()};
ACT.aucheck=()=>{const A=S.au,el=$('#audtype');if(!A||A.res||!el)return;A.typed=el.value;A.res=dictScore(A.q.c.text,A.typed);A.score+=A.res.pct/100;sfx(A.res.pct>=80?'ok':'bad');render()};
ACT.aunext=()=>{const A=S.au;if(!A)return;A.n++;if(A.n>=A.rounds)auFinish();else{auNext();render()}};
ACT.auins=d=>{const el=$('#audtype');if(!el)return;const s=el.selectionStart==null?el.value.length:el.selectionStart,e2=el.selectionEnd==null?s:el.selectionEnd;el.setRangeText(d.c,s,e2,'end');el.focus()};
ACT.audelask=()=>{AUD.confirmDel=true;render()};
ACT.audelno=()=>{AUD.confirmDel=false;render()};
ACT.audelyes=()=>{clearClips()};
ACT.lsnew=()=>{S.ls=S.ls||{n:0,score:0,q:null,pick:null};lsNew();render()};
ACT.lspick=d=>{const L=S.ls;if(!L||!L.q||L.pick)return;L.pick=d.v;L.n++;const ok=d.v===L.q.it.en;if(ok)L.score++;sfx(ok?'ok':'bad');
  if(L.n%5===0){P.audioDone++;addXP(6)}render()};
document.addEventListener('change',e=>{if(e.target.id==='audfiles')importFiles(e.target.files)});
VIEWS.audio=audio;
AFTER.audio=()=>{const el=$('#audtype');if(el&&S.au)el.value=S.au.typed||'';if(!AUD.loaded){AUD.loaded=true;loadClips()}};

/* ===== 09-games-common.js  Game Hub, icons, tower, leaderboard (simulated rivals), shared results screen.
   Each game lives in its own file (10-… to 14-…) and plugs in with VIEWS[id], ACT[...] and STOPS. ===== */

/* ---------- the eight games ---------- */

/* ---------- tower ---------- */
const TOWER_LV=[['Foundation',0],['Hut',5],['Compound',15],['Watchtower',30],['Palace',60],['Citadel',100]];
const towerLevel=n=>{let k=0;TOWER_LV.forEach((l,i)=>{if(n>=l[1])k=i});return TOWER_LV[k][0]};
/* Draws up to 30 stacked blocks; `extra` shows this round's new pieces in gold. */
function towerSvg(n,extra,h){
  const total=n+(extra||0),show=Math.min(total,30),cols=['var(--indigo)','var(--tint)','var(--hero)'],bh=Math.max(5,Math.min(12,220/Math.max(show,1)));
  let out='';for(let i=0;i<show;i++){const isNew=i>=show-Math.min(extra||0,show),w=84-Math.min(i,24)*1.6,y=236-(i+1)*bh;
    out+=`<rect x="${100-w/2}" y="${y}" width="${w}" height="${bh-1.5}" rx="2" fill="${isNew?'var(--gold)':cols[i%3]}" stroke="var(--fg)" stroke-width="1" opacity="${isNew?1:.95}"/>`}
  if(total>0)out+=`<path d="M100 ${236-show*bh-12}l8 10h-16z" fill="var(--gold)" stroke="var(--fg)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 200 250" height="${h||160}" role="img" aria-label="Tower with ${total} pieces"><line x1="20" x2="180" y1="238" y2="238" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>${out}</svg>`;
}

/* ---------- simulated rivals ---------- */
/* Everyone except you on the leaderboard is made up by the app. Scores change each week, and are the same for everyone viewing that week. */
const RIVAL_NAMES=['Ade','Tola','Kemi','Dapo','Funmi','Seyi','Bola','Yemisi','Taiwo','Kehinde','Shola','Lere','Ayo','Dami','Olamide','Temi','Bisi','Wale','Niyi','Sade','Femi','Tunde','Lola','Gbenga'];
const RIVAL_TAGS=['Runs','Fox','Zoom','Flash','Wave','Spark','99','Boss','Star','Ace','07','Tiger','Pro','Moon','Drum','Jolly'];
const LB_RANGE={runner:[300,4200],tone:[300,1150],match:[250,880],scramble:[250,1200],speed:[80,520],say:[200,1000],echo:[150,650],recall:[200,1000],tower:[3,110]};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const weekNo=()=>Math.floor((Date.now()-new Date(2024,0,1))/(7*864e5));
function rivals(lb){
  const rnd=mulberry(weekNo()*977+[...lb].reduce((a,c)=>a+c.charCodeAt(0),0)*131),[lo,hi]=LB_RANGE[lb],used=new Set(),out=[];
  while(out.length<24){const nm=RIVAL_NAMES[Math.floor(rnd()*RIVAL_NAMES.length)]+(rnd()<.5?'_':'')+RIVAL_TAGS[Math.floor(rnd()*RIVAL_TAGS.length)];
    if(used.has(nm))continue;used.add(nm);
    out.push({name:nm,score:Math.round(lo+(hi-lo)*Math.pow(rnd(),1.7)),bot:true})}
  return out;
}
const myScore=lb=>lb==='tower'?P.tower:P.best[lb]||0;
const myName=()=>(P.name||'').trim()||'You';
function board(lb){
  const me={name:myName(),score:myScore(lb),me:true};
  const all=[...rivals(lb),...(me.score>0?[me]:[])].sort((a,b)=>b.score-a.score);
  return{all,rank:me.score>0?all.indexOf(all.find(x=>x.me))+1:0};
}
function boardRows(lb,limit){
  const {all,rank}=board(lb),top=all.slice(0,limit||10);
  let rows=top.map((r,i)=>[i+1,r]);
  if(rank>(limit||10))rows=rows.concat([[0,null],[rank,all[rank-1]]]);
  return `<ol class="lb">${rows.map(([n,r])=>r?`<li class="${r.me?'me':''}"><span class="rk">${n}</span><span class="nm">${esc(r.name)}${r.bot?'<i class="sim">sim</i>':' <i class="you">you</i>'}</span><b>${r.score.toLocaleString()}</b></li>`:'<li class="gap" aria-hidden="true">…</li>').join('')}</ol>`;
}
